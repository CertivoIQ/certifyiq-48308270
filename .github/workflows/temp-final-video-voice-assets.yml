name: Temporary final video voice assets

on:
  push:
    branches:
      - temp/voice-audio-bridge-20260901
    paths:
      - .github/workflows/temp-final-video-voice-assets.yml

permissions:
  contents: read

jobs:
  fetch-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Download approved voice assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-voice
          curl --fail --location --retry 3 --output final-voice/brand-standard.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/43ae10dc-c6a5-48c1-8a84-51e90fbd93bf.mp3'
          curl --fail --location --retry 3 --output final-voice/brand-tagline.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/1400859b-8cd5-44e9-ab9c-f8b7424bdef6.mp3'
          curl --fail --location --retry 3 --output final-voice/mf01-post.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/fd62fa07-d293-4caf-b6fa-92259a448974.mp3'
          curl --fail --location --retry 3 --output final-voice/mf04-post.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/8866edc2-2d94-48c5-8470-1adfdb00189f.mp3'
          curl --fail --location --retry 3 --output final-voice/pha01-post.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/f1347dbf-2c87-498f-a5d7-0979f4aac1ee.mp3'
          curl --fail --location --retry 3 --output final-voice/pha05-post.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/35b8e60e-b3d1-450e-b763-a07ea7100f1b.mp3'
          for f in final-voice/*.mp3; do test -s "$f"; file "$f"; done
      - name: Upload final voice assets
        uses: actions/upload-artifact@v4
        with:
          name: certivoiq-final-voice-assets
          path: final-voice/*.mp3
          if-no-files-found: error
          retention-days: 1
