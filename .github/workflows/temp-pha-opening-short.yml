name: Temporary PHA opening short

on:
  push:
    branches:
      - temp/voice-audio-bridge-20260901
    paths:
      - .github/workflows/temp-pha-opening-short.yml

permissions:
  contents: read

jobs:
  fetch-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Download concise PHA opening pieces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pha-opening
          curl --fail --location --retry 3 --output pha-opening/01-prefix-short.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/91047e41-099b-4a68-b5ff-e4ebb964f6cb.mp3'
          curl --fail --location --retry 3 --output pha-opening/01-suffix-short.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/6df47633-5dc4-4d00-9bd2-9cdb121be791.mp3'
          for f in pha-opening/*.mp3; do test -s "$f"; file "$f"; done
      - name: Upload concise PHA opening pieces
        uses: actions/upload-artifact@v4
        with:
          name: pha-opening-short-pieces
          path: pha-opening/*.mp3
          if-no-files-found: error
          retention-days: 1
