name: Bind production runtime secrets to v9 candidate

on:
  push:
    paths:
      - '.github/workflows/cloudflare-v5-runtime-bindings.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bind-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: certivoiq-launch-candidate-20260905-v9
      TARGET_URL: https://certivoiq-launch-candidate-20260905-v9.rodsheka-watkins.workers.dev
      CURRENT_PRODUCTION_WORKER: certivoiq-launch-candidate-20260905-v8
      ZONE_NAME: certivoiq.com
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      STRIPE_LIVE_API_KEY: ${{ secrets.STRIPE_LIVE_API_KEY }}
      VITE_PAYMENTS_CLIENT_TOKEN: ${{ secrets.VITE_PAYMENTS_CLIENT_TOKEN }}
      PAYMENTS_LIVE_WEBHOOK_SECRET: ${{ secrets.PAYMENTS_LIVE_WEBHOOK_SECRET }}
      STRIPE_MULTIFAMILY_ENTERPRISE_PRICE_ID_LIVE: ${{ secrets.STRIPE_MULTIFAMILY_ENTERPRISE_PRICE_ID_LIVE }}
      STRIPE_PHA_PRICE_ID_LIVE: ${{ secrets.STRIPE_PHA_PRICE_ID_LIVE }}
      OPERATIONS_WORKER_SECRET: ${{ secrets.OPERATIONS_WORKER_SECRET }}
      STRIPE_BILLING_PORTAL_CONFIGURATION_ID_LIVE: ${{ secrets.STRIPE_BILLING_PORTAL_CONFIGURATION_ID_LIVE }}
      SUPPORT_EMAIL_WEBHOOK_SECRET: ${{ secrets.SUPPORT_EMAIL_WEBHOOK_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Confirm v9 candidate exists, production remains v8, and required secrets are present
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
            SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY
            STRIPE_LIVE_API_KEY VITE_PAYMENTS_CLIENT_TOKEN PAYMENTS_LIVE_WEBHOOK_SECRET
            STRIPE_MULTIFAMILY_ENTERPRISE_PRICE_ID_LIVE STRIPE_PHA_PRICE_ID_LIVE
            OPERATIONS_WORKER_SECRET
          )
          for name in "${required[@]}"; do
            test -n "${!name:-}" || { echo "Missing required GitHub secret: $name"; exit 1; }
          done
          echo 'REQUIRED_GITHUB_SECRETS=PASS'

          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          api='https://api.cloudflare.com/client/v4'
          settings_code="$(curl -sS -o /tmp/settings.json -w '%{http_code}' "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/settings")"
          echo "TARGET_SETTINGS_HTTP=$settings_code"
          test "$settings_code" = 200

          curl -fsS "${auth[@]}" "$api/zones?name=$ZONE_NAME&account.id=$CLOUDFLARE_ACCOUNT_ID" -o /tmp/zones.json
          zid="$(jq -r 'if .success and (.result|length)==1 then .result[0].id else empty end' /tmp/zones.json)"
          test -n "$zid"
          echo "ZONE_ID=$zid" >> "$GITHUB_ENV"

          curl -fsS "${auth[@]}" "$api/zones/$zid/workers/routes" -o /tmp/routes-before.json
          routes_count="$(jq -r '.result|length' /tmp/routes-before.json)"
          echo "WORKER_ROUTES_COUNT=$routes_count"
          test "$routes_count" = 0

          curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" -o /tmp/domains-before.json
          www_service="$(jq -r '.result[]|select(.hostname=="www.certivoiq.com")|.service' /tmp/domains-before.json)"
          apex_service="$(jq -r '.result[]|select(.hostname=="certivoiq.com")|.service' /tmp/domains-before.json)"
          echo "WWW_SERVICE=$www_service"
          echo "APEX_SERVICE=$apex_service"
          test "$www_service" = "$CURRENT_PRODUCTION_WORKER"
          test "$apex_service" = "$CURRENT_PRODUCTION_WORKER"
          echo 'PRODUCTION_STILL_V8_GATE=PASS'

      - name: Bind existing production runtime secrets to v9
        shell: bash
        run: |
          set -euo pipefail
          payload="$(mktemp)"
          PAYLOAD="$payload" node <<'NODE'
          const fs = require('fs');
          const required = [
            'SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY','VITE_SUPABASE_URL','VITE_SUPABASE_PUBLISHABLE_KEY',
            'STRIPE_LIVE_API_KEY','VITE_PAYMENTS_CLIENT_TOKEN','PAYMENTS_LIVE_WEBHOOK_SECRET',
            'STRIPE_MULTIFAMILY_ENTERPRISE_PRICE_ID_LIVE','STRIPE_PHA_PRICE_ID_LIVE','OPERATIONS_WORKER_SECRET'
          ];
          const optional = ['STRIPE_BILLING_PORTAL_CONFIGURATION_ID_LIVE','SUPPORT_EMAIL_WEBHOOK_SECRET'];
          const secrets = {};
          for (const name of required) {
            const text = process.env[name];
            if (!text) throw new Error(`${name} missing`);
            secrets[name] = { type: 'secret_text', name, text };
          }
          for (const name of optional) {
            const text = process.env[name];
            if (text) secrets[name] = { type: 'secret_text', name, text };
          }
          fs.writeFileSync(process.env.PAYLOAD, JSON.stringify({ secrets }), { mode: 0o600 });
          NODE

          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          api='https://api.cloudflare.com/client/v4'
          code="$(curl -sS -X PATCH "${auth[@]}" -H 'Content-Type: application/json' \
            --data-binary "@$payload" \
            -o /tmp/bulk-result.json -w '%{http_code}' \
            "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/secrets-bulk")"
          rm -f "$payload"
          echo "BULK_SECRET_HTTP=$code"
          test "$code" = 200
          jq -e '.success == true' /tmp/bulk-result.json >/dev/null
          echo 'V9_RUNTIME_SECRET_BIND=PASS'

      - name: Verify exact secret names and authenticated v9 runtime health
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          api='https://api.cloudflare.com/client/v4'
          curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/secrets" -o /tmp/secrets-after.json
          jq -e '.success == true' /tmp/secrets-after.json >/dev/null

          required=(
            SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY
            STRIPE_LIVE_API_KEY VITE_PAYMENTS_CLIENT_TOKEN PAYMENTS_LIVE_WEBHOOK_SECRET
            STRIPE_MULTIFAMILY_ENTERPRISE_PRICE_ID_LIVE STRIPE_PHA_PRICE_ID_LIVE
            OPERATIONS_WORKER_SECRET
          )
          for name in "${required[@]}"; do
            jq -e --arg n "$name" '.result[] | select(.name==$n and .type=="secret_text")' /tmp/secrets-after.json >/dev/null
          done
          echo "BOUND_SECRET_NAMES=$(jq -r '[.result[].name] | sort | join(",")' /tmp/secrets-after.json)"

          ok=0
          for i in $(seq 1 15); do
            code="$(curl -sS -o /tmp/health.out -w '%{http_code}' -H "Authorization: Bearer $OPERATIONS_WORKER_SECRET" "$TARGET_URL/api/internal/runtime-health")"
            echo "v9 runtime-health attempt $i HTTP $code"
            if [ "$code" = 204 ]; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
          node scripts/verify-cloudflare-live-response.mjs "$TARGET_URL"
          echo 'V9_RUNTIME_AND_EDGE_GATE=PASS'

      - name: Confirm production domains remain v8 and Worker Routes remain empty
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          api='https://api.cloudflare.com/client/v4'
          curl -fsS "${auth[@]}" "$api/zones/$ZONE_ID/workers/routes" -o /tmp/routes-final.json
          jq -e '.success == true and (.result|length)==0' /tmp/routes-final.json >/dev/null
          curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" -o /tmp/domains-final.json
          test "$(jq -r '.result[]|select(.hostname=="www.certivoiq.com")|.service' /tmp/domains-final.json)" = "$CURRENT_PRODUCTION_WORKER"
          test "$(jq -r '.result[]|select(.hostname=="certivoiq.com")|.service' /tmp/domains-final.json)" = "$CURRENT_PRODUCTION_WORKER"
          echo 'FINAL_DOMAIN_STATE=V8_V8'
          echo 'FINAL_WORKER_ROUTES=EMPTY'
