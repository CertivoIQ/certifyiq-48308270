name: Cloudflare candidate deploy

on:
  workflow_dispatch:
    inputs:
      candidate_worker_name:
        description: Dedicated workers.dev candidate name (must not be production Worker)
        required: true
        default: certivoiq-cutover-candidate-20260903
        type: string
  push:
    branches:
      - deploy/cloudflare-current-main-v6-20260905

permissions:
  contents: read

jobs:
  deploy-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_CANDIDATE_WORKER_NAME: ${{ inputs.candidate_worker_name || 'certivoiq-launch-candidate-20260905-v6' }}

    steps:
      - name: Require Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is missing. Add it as a GitHub Actions secret; do not paste it into workflow inputs or logs."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is missing. Add it as a GitHub Actions secret."
            exit 1
          fi
          echo "Cloudflare credentials are present (values not displayed)."

      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test candidate config safety gate
        run: node --test scripts/test-cloudflare-candidate-config.mjs

      - name: Build exact candidate
        run: bun run build

      - name: Prepare isolated candidate Wrangler config
        run: |
          node scripts/prepare-cloudflare-candidate-config.mjs \
            .output/server/wrangler.json \
            .output/server/wrangler.candidate.json \
            "$CLOUDFLARE_CANDIDATE_WORKER_NAME"

      - name: Deploy candidate to workers.dev only
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          npx --yes wrangler@4 deploy \
            --config .output/server/wrangler.candidate.json \
            2>&1 | tee "$log_file"

          candidate_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$log_file" | tail -n 1 || true)"
          if [ -z "$candidate_url" ]; then
            echo "Deployment completed but a workers.dev URL could not be extracted from Wrangler output."
            exit 1
          fi

          echo "candidate_url=$candidate_url" >> "$GITHUB_OUTPUT"
          echo "Candidate URL: $candidate_url"

      - name: Verify live Cloudflare candidate response boundary
        shell: bash
        run: |
          set -euo pipefail
          candidate_url="${{ steps.deploy.outputs.candidate_url }}"
          for attempt in 1 2 3 4 5 6; do
            if node scripts/verify-cloudflare-live-response.mjs "$candidate_url"; then
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "Candidate response boundary did not become healthy after $attempt attempts."
              exit 1
            fi
            echo "Candidate hostname is not ready yet (attempt $attempt/6); retrying in 10 seconds."
            sleep 10
          done

      - name: Confirm production route remains outside this workflow
        run: |
          echo "Candidate verification completed."
          echo "This workflow does not create or change certivoiq.com routes, custom domains, DNS records, Supabase data, or billing state."
