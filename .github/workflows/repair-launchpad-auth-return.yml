name: Repair LaunchPad sign-in return
on:
  push:
    branches: [fix/preserve-launchpad-login-return]
    paths: ['.github/workflows/repair-launchpad-auth-return.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Apply exact guarded source correction
        run: |
          test "$(git hash-object src/routes/auth.tsx)" = 03fa170b41a8743ef1bffd9c0b95e57acafcc9c1
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/routes/auth.tsx');s=p.read_text()
          s=s.replace('function afterAuthTarget(): AuthTarget {','// Inspecting a return destination must not consume it before authentication succeeds.\nfunction afterAuthTarget(consume = false): AuthTarget {')
          s=s.replace('if (saved) sessionStorage.removeItem("certivoiq:after-auth");','if (saved && consume) sessionStorage.removeItem("certivoiq:after-auth");')
          old='      navigate({ to: target as AuthTarget, replace: true });'
          assert s.count(old)==1
          s=s.replace(old,'      afterAuthTarget(true);\n'+old)
          old='to: isFreeReviewReturn() ? "/trial" : afterAuthTarget(), replace: true'
          assert s.count(old)==2
          s=s.replace(old,'to: isFreeReviewReturn() ? "/trial" : afterAuthTarget(true), replace: true')
          s=s.replace('if (data.session) { navigate({ to: returnTo, replace: true }); return; }','if (data.session) { afterAuthTarget(true); navigate({ to: returnTo, replace: true }); return; }')
          assert s.count('afterAuthTarget(true)')==4
          p.write_text(s)
          p=Path('scripts/test-onboarding-handoff.mjs');s=p.read_text()
          assert 'test-income-auth-return.mjs' not in s
          p.write_text(s+'\n// Sign-in must preserve the onboarding destination until authentication succeeds.\nimport "./test-income-auth-return.mjs";\n')
          PY
          cat > scripts/test-income-auth-return.mjs <<'JS'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import vm from 'node:vm';
          import ts from 'typescript';
          const source=readFileSync('src/routes/auth.tsx','utf8');
          const start=source.indexOf('function afterAuthTarget('),end=source.indexOf('\nfunction isFreeReviewReturn',start);
          assert.ok(start>=0&&end>start);
          function fixture(saved){
            let value=saved,removals=0;
            const sessionStorage={getItem:key=>{assert.equal(key,'certivoiq:after-auth');return value;},removeItem:key=>{assert.equal(key,'certivoiq:after-auth');value=null;removals++;}};
            const exports={};
            const code=ts.transpileModule(source.slice(start,end)+'\nexport { afterAuthTarget };',{compilerOptions:{target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.CommonJS}}).outputText;
            vm.runInNewContext(code,{exports,sessionStorage});
            return {read:exports.afterAuthTarget,stored:()=>value,removals:()=>removals};
          }
          for(const target of ['/launchpad','/pricing','/trial'])test(`pre-authentication inspection preserves ${target}`,()=>{
            const f=fixture(target);assert.equal(f.read(),target);assert.equal(f.read(),target);assert.equal(f.stored(),target);assert.equal(f.removals(),0);
            assert.equal(f.read(true),target);assert.equal(f.stored(),null);assert.equal(f.removals(),1);assert.equal(f.read(),'/dashboard');
          });
          for(const target of [null,'https://example.com','//example.com','/unapproved'])test(`unapproved return destination is not followed: ${target}`,()=>{assert.equal(fixture(target).read(),'/dashboard');});
          test('session and MFA checks precede successful return consumption',()=>{
            const effect=source.slice(source.indexOf('  useEffect(() => {'),source.indexOf('  async function proceedAfterMfa'));
            assert.ok(effect.indexOf('!sessionData.session')<effect.indexOf('afterAuthTarget(true)'));
            assert.ok(effect.indexOf('aalData?.currentLevel !== "aal2"')<effect.indexOf('afterAuthTarget(true)'));
            assert.match(effect,/const target = isFreeReviewReturn\(\) \? "\/trial" : afterAuthTarget\(\)/);
          });
          JS
      - name: Verify regression and syntax
        run: |
          bun install --frozen-lockfile
          node --test scripts/test-onboarding-handoff.mjs
      - name: Commit only application and test files
        run: |
          git config user.name 'CertivoIQ Release Bot'
          git config user.email 'release-bot@certivoiq.com'
          git add src/routes/auth.tsx scripts/test-income-auth-return.mjs scripts/test-onboarding-handoff.mjs
          git commit -m 'Preserve LaunchPad return until sign-in succeeds; add eight navigation regressions'
          git push origin HEAD:fix/preserve-launchpad-login-return
