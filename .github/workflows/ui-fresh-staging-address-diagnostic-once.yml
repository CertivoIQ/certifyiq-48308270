name: UI fresh staging address diagnostic once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ui-fresh-staging-address-diagnostic-once.yml']
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: certivoiq-ui-staging-20260904
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.3 }
      - name: Query exact Worker deployments and versions
        shell: bash
        run: |
          set -euo pipefail
          echo '=== WRANGLER DEPLOYMENTS ==='
          bunx --bun wrangler@4.128.0 deployments list --name "$TARGET_WORKER" || true
          echo '=== WRANGLER VERSIONS ==='
          bunx --bun wrangler@4.128.0 versions list --name "$TARGET_WORKER" || true
      - name: Query Cloudflare exact deployment metadata
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          for endpoint in \
            "workers/scripts/$TARGET_WORKER/deployments" \
            "workers/scripts/$TARGET_WORKER/settings" \
            "workers/scripts-search?id=$TARGET_WORKER" \
            "workers/scripts-search?name=$TARGET_WORKER"; do
            safe="$(echo "$endpoint" | tr '/?=&' '_____')"
            code="$(curl -sS -o "/tmp/$safe.json" -w '%{http_code}' "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/$endpoint")"
            echo "API $endpoint HTTP $code"
            if [ "$code" = 200 ]; then
              jq -c '{success,result:(.result // null)}' "/tmp/$safe.json" | head -c 12000 || true
              echo
            fi
          done
      - name: Probe likely version preview hosts from deployments
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          code="$(curl -sS -o /tmp/deployments.json -w '%{http_code}' "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/deployments")"
          [ "$code" = 200 ] || { echo 'Deployments endpoint unavailable for compact host derivation.'; exit 0; }
          jq -r '.. | strings | select(test("workers\\.dev|workers\\.dev/|preview";"i"))' /tmp/deployments.json | sort -u | head -20 || true
          echo 'ADDRESS_DIAGNOSTIC_COMPLETE'
