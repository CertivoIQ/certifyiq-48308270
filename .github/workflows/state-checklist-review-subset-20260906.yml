name: State checklist archived evidence review subset
on:
  push:
    branches: [research/state-pack-pdf-evidence-20260906]
    paths: [.github/workflows/state-checklist-review-subset-20260906.yml]
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Watkin5/certifyiq-48308270
          run-id: 34013717716
          artifact-ids: 9983304630,9983304952
          path: archived
          merge-multiple: true
      - name: Select and verify original file identities
        run: |
          python3 - <<'PY'
          import json,pathlib,hashlib,shutil
          root=pathlib.Path('archived');out=pathlib.Path('review-subset');out.mkdir()
          manifest=next(json.loads(p.read_text()) for p in root.rglob('manifest.json') if 'results' in json.loads(p.read_text()))
          selected=[];seen=set()
          for result in manifest['results']:
            s=result['state_code']
            for doc in result['captured_documents']:
              u=doc['source_url'];h=u+' '+doc['link_label'];sha=doc['source_sha256']
              take=(s=='MA' and '/2025-2026-lihtc-qap/download' in u) or (s=='ME' and ('notice-2026-' in u or 'training-webinars' in u)) or (s=='MN' and ('general_info_tutorial' in u or 'mhfa_1042363' in u)) or (s=='PA' and ('phfa-property-compliance-manual' in u or '2026-rent-summary' in u)) or (s=='IL' and ('MB-634' in u or 'MB-632' in u)) or (s=='KS' and 'Compliance-Update-February-2024' in u) or (s=='WA' and '130Zb_Post-Year15' in u)
              if not take or sha in seen:continue
              matches=list(root.rglob(sha+'.pdf'))
              if not matches:raise RuntimeError('Missing original '+sha)
              original=matches[0];data=original.read_bytes()
              if hashlib.sha256(data).hexdigest()!=sha:raise RuntimeError('Hash mismatch '+sha)
              dest=out/s;dest.mkdir(exist_ok=True);shutil.copy2(original,dest/original.name)
              for txt in root.rglob(sha+'.txt'):shutil.copy2(txt,dest/txt.name);break
              selected.append(doc);seen.add(sha)
          if len(selected)!=21:raise RuntimeError('Unexpected selection count '+str(len(selected)))
          (out/'manifest.json').write_text(json.dumps({'records':selected,'original_run_id':34013717716,'original_artifact_id':9983304630,'original_artifact_digest':'sha256:2606e00453a090c94c35344790b6285db1d10a75f36468b425062febc91161ef','archive_sha256_verification_passed':True,'policy':'Byte-preserving selected archive recovery only. No new retrieval dates or approvals.'},indent=2))
          print('RECOVERED_AND_SHA_VERIFIED',len(selected))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: state-checklist-selected-original-review
          path: review-subset/
          retention-days: 90
          if-no-files-found: error
