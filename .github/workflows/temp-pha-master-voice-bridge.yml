name: Temporary PHA master voice bridge

on:
  push:
    branches:
      - temp/voice-audio-bridge-20260901
    paths:
      - .github/workflows/temp-pha-master-voice-bridge.yml

permissions:
  contents: read

jobs:
  fetch-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Download corrected PHA narration segments
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pha-master
          curl --fail --location --retry 3 --output pha-master/01.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/6e615c99-d12b-47a3-8b74-0dbafc6af6df.mp3'
          curl --fail --location --retry 3 --output pha-master/02.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/5dd81358-202d-4af5-9eeb-531b8024e4b9.mp3'
          curl --fail --location --retry 3 --output pha-master/03.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/53f2931b-2f36-40dd-a3e6-e23044171d78.mp3'
          curl --fail --location --retry 3 --output pha-master/04.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/f78fa68b-2be7-40eb-86f8-4cbee1e2587d.mp3'
          curl --fail --location --retry 3 --output pha-master/05.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/edae1555-f5b4-4853-bc77-ee015577c6c1.mp3'
          curl --fail --location --retry 3 --output pha-master/06.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/b1dd7d88-3fc1-4c7f-9765-fb903258bf32.mp3'
          curl --fail --location --retry 3 --output pha-master/07.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/f2ece69a-7c71-49c2-a515-43a2ba228b15.mp3'
          curl --fail --location --retry 3 --output pha-master/08.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/f666ce07-2220-4a06-8462-3bf1e1a9493a.mp3'
          curl --fail --location --retry 3 --output pha-master/09.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/fa9f2c77-764a-4417-9cfe-3e4d79bd91b7.mp3'
          curl --fail --location --retry 3 --output pha-master/10.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/b32a4593-8b71-4b3a-8ece-58cb84a674d6.mp3'
          for f in pha-master/*.mp3; do test -s "$f"; file "$f"; done
      - name: Upload PHA narration package
        uses: actions/upload-artifact@v4
        with:
          name: pha-master-voice-segments
          path: pha-master/*.mp3
          if-no-files-found: error
          retention-days: 1
