name: CertivoIQ v5 production closeout

on:
  push:
    paths:
      - '.github/workflows/cloudflare-v5-postcutover-closeout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPERATIONS_WORKER_SECRET: ${{ secrets.OPERATIONS_WORKER_SECRET }}
      V3_WORKER: certivoiq-launch-candidate-20260904-v3
      V5_WORKER: certivoiq-launch-candidate-20260904-v5
      ZONE_NAME: certivoiq.com

    steps:
      - uses: actions/checkout@v4

      - name: Confirm v5 routing state before purge
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${OPERATIONS_WORKER_SECRET:-}"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          api='https://api.cloudflare.com/client/v4'

          curl -fsS "${auth[@]}" "$api/zones?name=$ZONE_NAME&account.id=$CLOUDFLARE_ACCOUNT_ID" -o /tmp/zones.json
          zid="$(jq -r 'if .success and (.result|length)==1 then .result[0].id else empty end' /tmp/zones.json)"
          test -n "$zid"
          echo "ZONE_ID=$zid" >> "$GITHUB_ENV"

          curl -fsS "${auth[@]}" "$api/zones/$zid/workers/routes" -o /tmp/routes-before.json
          jq -e '.success == true and (.result|length)==0' /tmp/routes-before.json >/dev/null

          curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" -o /tmp/domains-before.json
          test "$(jq -r '.result[]|select(.hostname=="www.certivoiq.com")|.service' /tmp/domains-before.json)" = "$V5_WORKER"
          test "$(jq -r '.result[]|select(.hostname=="certivoiq.com")|.service' /tmp/domains-before.json)" = "$V5_WORKER"
          echo 'PRE_PURGE_DOMAIN_GATE=V5_V5'
          echo 'PRE_PURGE_WORKER_ROUTES=EMPTY'

      - name: Purge both production hostnames
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          api='https://api.cloudflare.com/client/v4'
          body="$(jq -nc '{hosts:["www.certivoiq.com","certivoiq.com"]}')"
          code="$(curl -sS -X POST "${auth[@]}" -H 'Content-Type: application/json' --data "$body" -o /tmp/purge.json -w '%{http_code}' "$api/zones/$ZONE_ID/purge_cache")"
          echo "PURGE_HTTP=$code"
          test "$code" = 200
          jq -e '.success == true' /tmp/purge.json >/dev/null
          echo 'PURGE_WWW_CERTIVOIQ_COM=PASS'
          echo 'PURGE_CERTIVOIQ_COM=PASS'

      - name: Verify production runtime and edge after purge
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl -sS -o /tmp/health.out -w '%{http_code}' -H "Authorization: Bearer $OPERATIONS_WORKER_SECRET" https://certivoiq.com/api/internal/runtime-health)"
          echo "PRODUCTION_RUNTIME_HEALTH_HTTP=$health"
          test "$health" = 204
          node scripts/verify-cloudflare-live-response.mjs https://certivoiq.com
          node scripts/verify-cloudflare-live-response.mjs https://www.certivoiq.com
          echo 'POST_PURGE_RUNTIME_AND_EDGE_GATE=PASS'

      - name: Verify live navigation bundle labels
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/live-crawl
          mkdir -p /tmp/live-crawl
          python3 <<'PY'
          import re, urllib.parse, urllib.request, pathlib, sys
          origin = 'https://certivoiq.com/'
          out = pathlib.Path('/tmp/live-crawl')
          headers = {'User-Agent':'CertivoIQ-production-closeout/1.0','Cache-Control':'no-cache'}

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.geturl(), r.read()

          final_url, html = get(origin)
          (out/'root.html').write_bytes(html)
          text = html.decode('utf-8','ignore')
          refs = set(re.findall(r'''(?:src|href)=["']([^"']+\.js(?:\?[^"']*)?)["']''', text))
          queue = [urllib.parse.urljoin(final_url, x) for x in refs]
          seen = set()
          corpus = []
          while queue and len(seen) < 300:
              url = queue.pop(0)
              parsed = urllib.parse.urlparse(url)
              if parsed.netloc not in {'certivoiq.com','www.certivoiq.com'} or not parsed.path.endswith('.js'):
                  continue
              clean = urllib.parse.urlunparse(parsed._replace(query='', fragment=''))
              if clean in seen:
                  continue
              seen.add(clean)
              try:
                  resolved, data = get(clean)
              except Exception:
                  continue
              js = data.decode('utf-8','ignore')
              corpus.append((resolved, js))
              for ref in re.findall(r'''["']([^"']+\.js(?:\?[^"']*)?)["']''', js):
                  nxt = urllib.parse.urljoin(resolved, ref)
                  p = urllib.parse.urlparse(nxt)
                  if p.netloc in {'certivoiq.com','www.certivoiq.com'}:
                      queue.append(nxt)

          expected_a = 'Upload Certification & OCR'
          expected_b = 'Onboarding & Portfolio Setup'
          forbidden = 'Properties & Tenant Intake'
          matches = [(u,j) for u,j in corpus if expected_a in j and expected_b in j]
          if not matches:
              print(f'LIVE_JS_FILES_CRAWLED={len(corpus)}')
              raise SystemExit('No live JavaScript asset contained both expected navigation labels')
          if any(forbidden in j for _,j in corpus):
              raise SystemExit('Forbidden completed-Command-Center label is still present in live JavaScript corpus')
          url, _ = matches[0]
          print(f'LIVE_JS_FILES_CRAWLED={len(corpus)}')
          print(f'LIVE_NAV_ASSET={url}')
          print('LIVE_UPLOAD_CERTIFICATION_OCR_LABEL=PASS')
          print('LIVE_ONBOARDING_PORTFOLIO_SETUP_LABEL=PASS')
          print('LIVE_PROPERTIES_TENANT_INTAKE_LABEL_ABSENT=PASS')
          PY

      - name: Verify source navigation placement regression
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/test-dashboard-navigation-access.mjs scripts/test-onboarding-certification-separation.mjs
          echo 'SOURCE_NAVIGATION_PLACEMENT_GATE=PASS'

      - name: Capture final Worker deployment and rollback posture
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          api='https://api.cloudflare.com/client/v4'

          curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$V5_WORKER/deployments" -o /tmp/v5-deployments.json
          deployed_version="$(jq -r '.result.deployments[0].versions[]? | select(.percentage==100) | .version_id' /tmp/v5-deployments.json | head -1)"
          test -n "$deployed_version"
          echo "FINAL_V5_DEPLOYED_VERSION=$deployed_version"

          test "$(curl -sS -o /tmp/v3-settings.json -w '%{http_code}' "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$V3_WORKER/settings")" = 200

          curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" -o /tmp/domains-final.json
          test "$(jq '[.result[]|select((.hostname=="www.certivoiq.com" or .hostname=="certivoiq.com") and .service==$V3)]|length' --arg V3 "$V3_WORKER" /tmp/domains-final.json)" = 0
          test "$(jq -r '.result[]|select(.hostname=="www.certivoiq.com")|.service' /tmp/domains-final.json)" = "$V5_WORKER"
          test "$(jq -r '.result[]|select(.hostname=="certivoiq.com")|.service' /tmp/domains-final.json)" = "$V5_WORKER"

          curl -fsS "${auth[@]}" "$api/zones/$ZONE_ID/workers/routes" -o /tmp/routes-final.json
          jq -e '.success == true and (.result|length)==0' /tmp/routes-final.json >/dev/null
          echo 'V3_WORKER_EXISTS_DETACHED=PASS'
          echo 'FINAL_DOMAINS=V5_V5'
          echo 'FINAL_WORKER_ROUTES=EMPTY'
          echo 'CERTIVOIQ_V5_PRODUCTION_CLOSEOUT=PASS'
