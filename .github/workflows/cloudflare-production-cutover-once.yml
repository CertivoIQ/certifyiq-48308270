name: Cloudflare production cutover once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-production-cutover-once.yml"

permissions:
  contents: read

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: certivoiq-cutover-candidate-20260903

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Capture production route rollback state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=certivoiq.com&account.id=$CLOUDFLARE_ACCOUNT_ID" \
            -o /tmp/zones.json
          zone_id="$(node -e 'const d=require("/tmp/zones.json"); if(!d.success||d.result.length!==1) process.exit(1); process.stdout.write(d.result[0].id)')"
          rm -f /tmp/zones.json
          test -n "$zone_id"

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/workers/routes" \
            -o /tmp/routes-before.json

          ZONE_ID="$zone_id" TARGET_WORKER="$TARGET_WORKER" node <<'NODE'
          const fs = require('fs');
          const d = require('/tmp/routes-before.json');
          if (!d.success) throw new Error('Cloudflare route inventory failed');
          const patterns = ['certivoiq.com/*', 'www.certivoiq.com/*'];
          const routes = patterns.map((pattern) => {
            const matches = d.result.filter((r) => r.pattern === pattern);
            if (matches.length !== 1) throw new Error(`Expected exactly one existing route for ${pattern}`);
            const route = matches[0];
            if (!route.id || !route.script) throw new Error(`Existing route ${pattern} has no rollback script`);
            if (route.script === process.env.TARGET_WORKER) throw new Error(`${pattern} already points to the target Worker; refusing ambiguous one-time cutover`);
            return { id: route.id, pattern, oldScript: route.script };
          });
          const state = { zoneId: process.env.ZONE_ID, targetWorker: process.env.TARGET_WORKER, routes };
          fs.writeFileSync('/tmp/cloudflare-cutover-state.json', JSON.stringify(state), { mode: 0o600 });
          console.log(`PASS: rollback state captured for ${routes.length} production routes.`);
          console.log(`Rollback worker: ${routes[0].oldScript}`);
          NODE
          rm -f /tmp/routes-before.json
          echo "zone_id=$zone_id" >> "$GITHUB_OUTPUT"

      - name: Switch existing production routes to verified Worker
        id: route_cutover
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const state = JSON.parse(fs.readFileSync('/tmp/cloudflare-cutover-state.json','utf8'));
          if (state.routes.some((r) => r.oldScript !== state.routes[0].oldScript)) {
            throw new Error('Apex and www routes have different rollback Workers; refusing cutover');
          }
          NODE

          rollback_partial() {
            echo "Cutover step failed; restoring captured route state."
            node -e 'const s=require("/tmp/cloudflare-cutover-state.json"); for(const r of s.routes) console.log([r.id,r.pattern,r.oldScript].join("\t"))' |
            while IFS=$'\t' read -r route_id pattern old_script; do
              body="$(node -e 'process.stdout.write(JSON.stringify({pattern:process.argv[1],script:process.argv[2]}))' "$pattern" "$old_script")"
              curl --silent --show-error \
                -X PUT \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$body" \
                "https://api.cloudflare.com/client/v4/zones/${{ steps.state.outputs.zone_id }}/workers/routes/$route_id" \
                -o /tmp/rollback-partial.json || true
            done
          }
          trap rollback_partial ERR

          node -e 'const s=require("/tmp/cloudflare-cutover-state.json"); for(const r of s.routes) console.log([r.id,r.pattern].join("\t"))' |
          while IFS=$'\t' read -r route_id pattern; do
            body="$(node -e 'process.stdout.write(JSON.stringify({pattern:process.argv[1],script:process.argv[2]}))' "$pattern" "$TARGET_WORKER")"
            curl --fail --silent --show-error \
              -X PUT \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$body" \
              "https://api.cloudflare.com/client/v4/zones/${{ steps.state.outputs.zone_id }}/workers/routes/$route_id" \
              -o /tmp/route-update.json
            node -e 'const d=require("/tmp/route-update.json"); if(!d.success||d.result.script!==process.env.TARGET_WORKER) process.exit(1)'
          done
          rm -f /tmp/route-update.json
          trap - ERR
          echo "PASS: existing apex and www routes now point to $TARGET_WORKER."

      - name: Verify production route ownership
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/${{ steps.state.outputs.zone_id }}/workers/routes" \
            -o /tmp/routes-after.json
          TARGET_WORKER="$TARGET_WORKER" node <<'NODE'
          const d = require('/tmp/routes-after.json');
          if (!d.success) process.exit(1);
          for (const pattern of ['certivoiq.com/*','www.certivoiq.com/*']) {
            const matches = d.result.filter((r) => r.pattern === pattern);
            if (matches.length !== 1 || matches[0].script !== process.env.TARGET_WORKER) {
              throw new Error(`${pattern} is not owned by the verified Worker`);
            }
          }
          console.log('PASS: production routes confirmed on verified Worker.');
          NODE
          rm -f /tmp/routes-after.json

      - name: Verify production runtime dependencies
        shell: bash
        env:
          OPERATIONS_WORKER_SECRET: ${{ secrets.OPERATIONS_WORKER_SECRET }}
        run: |
          set -euo pipefail
          for origin in https://certivoiq.com https://www.certivoiq.com; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              -H "Authorization: Bearer $OPERATIONS_WORKER_SECRET" \
              "$origin/api/internal/runtime-health")"
            test "$status" = "204" || { echo "$origin runtime health returned HTTP $status"; exit 1; }
          done
          echo "PASS: production Worker reached Supabase and Stripe through both public hostnames."

      - name: Verify production Cloudflare security boundary
        run: |
          node scripts/verify-cloudflare-live-response.mjs "https://certivoiq.com"
          node scripts/verify-cloudflare-live-response.mjs "https://www.certivoiq.com"

      - name: Verify production application response
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-redirs 5 https://certivoiq.com/ -o /tmp/certivoiq-production.html
          grep -q "CertivoIQ" /tmp/certivoiq-production.html
          rm -f /tmp/certivoiq-production.html
          echo "PASS: CertivoIQ production application response is readable."

      - name: Roll back production routes on any post-cutover failure
        if: ${{ failure() && steps.route_cutover.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Production verification failed. Restoring both captured Worker routes."
          node -e 'const s=require("/tmp/cloudflare-cutover-state.json"); for(const r of s.routes) console.log([r.id,r.pattern,r.oldScript].join("\t"))' |
          while IFS=$'\t' read -r route_id pattern old_script; do
            body="$(node -e 'process.stdout.write(JSON.stringify({pattern:process.argv[1],script:process.argv[2]}))' "$pattern" "$old_script")"
            curl --fail --silent --show-error \
              -X PUT \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$body" \
              "https://api.cloudflare.com/client/v4/zones/${{ steps.state.outputs.zone_id }}/workers/routes/$route_id" \
              -o /tmp/route-rollback.json
            node -e 'const d=require("/tmp/route-rollback.json"); if(!d.success) process.exit(1)'
          done
          rm -f /tmp/route-rollback.json

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/${{ steps.state.outputs.zone_id }}/workers/routes" \
            -o /tmp/routes-restored.json
          node <<'NODE'
          const fs = require('fs');
          const state = JSON.parse(fs.readFileSync('/tmp/cloudflare-cutover-state.json','utf8'));
          const d = require('/tmp/routes-restored.json');
          if (!d.success) process.exit(1);
          for (const expected of state.routes) {
            const route = d.result.find((r) => r.id === expected.id);
            if (!route || route.pattern !== expected.pattern || route.script !== expected.oldScript) {
              throw new Error(`Rollback verification failed for ${expected.pattern}`);
            }
          }
          console.log('ROLLBACK_VERIFIED=TRUE');
          NODE
          rm -f /tmp/routes-restored.json

      - name: Confirm production cutover
        if: ${{ success() }}
        run: |
          echo "PRODUCTION_CLOUDFLARE_CUTOVER=PASS"
          echo "certivoiq.com/* and www.certivoiq.com/* now route to the verified Worker."
          echo "DNS records, Supabase data, Stripe objects, billing state, and Lovable resources were not changed."
