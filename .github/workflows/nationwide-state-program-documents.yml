name: Nationwide State Program Documents
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/crawl-nationwide-state-program-documents.mjs
      - src/lib/nationwide-state-source-discovery.json
      - .github/workflows/nationwide-state-program-documents.yml
      - supabase/migrations/20260903202000_nationwide_exact_document_evidence_correction.sql
      - supabase/migrations/20260903202500_founder_state_rule_single_operator_activation.sql
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nationwide-state-program-documents-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Crawl exact nationwide program documents
        run: node scripts/crawl-nationwide-state-program-documents.mjs
      - name: Upload exact program-document evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nationwide-state-program-documents
          path: artifacts/nationwide-state-program-documents.json
          if-no-files-found: error
          retention-days: 30
