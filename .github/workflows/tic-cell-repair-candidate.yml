name: TIC recognition and calculation regression
on:
  push:
    branches: [main, fix/tic-cell-recognition-20260905]
    paths:
      - '.github/workflows/tic-cell-repair-candidate.yml'
      - 'src/lib/tic-*'
      - 'src/lib/pdf-ocr.ts'
      - 'src/components/tic-*'
      - 'src/components/certivoiq-tic-review-form.tsx'
      - 'src/components/certification-*'
      - 'src/utils/tic-*'
      - 'src/utils/certification-review.functions.ts'
      - 'scripts/*tic*'
      - 'docs/tic-cell-repair-status.md'
  pull_request:
    paths:
      - '.github/workflows/tic-cell-repair-candidate.yml'
      - 'src/lib/tic-*'
      - 'src/lib/pdf-ocr.ts'
      - 'src/components/tic-*'
      - 'src/components/certivoiq-tic-review-form.tsx'
      - 'src/components/certification-*'
      - 'src/utils/tic-*'
      - 'src/utils/certification-review.functions.ts'
      - 'scripts/*tic*'
permissions:
  contents: read
concurrency:
  group: tic-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check six repaired type roots
        run: node scripts/check-tic-supporting-types.mjs
      - name: Verify extraction, calculations and intake separation
        run: |
          set -o pipefail
          node --test scripts/test-tic-*.mjs scripts/test-certification-pipeline-performance.mjs scripts/test-onboarding-certification-separation.mjs | tee tic-verification.txt
      - name: Build without deployment
        run: |
          set -o pipefail
          npm run build | tee tic-build.txt
      - name: Record tested revision
        run: |
          # The router regenerates this build artifact from existing route modules.
          # Preserve its diff separately; all other source must stay unchanged.
          git diff -- src/routeTree.gen.ts > tic-generated-route-diff.txt
          git diff --exit-code -- src ':(exclude)src/routeTree.gen.ts'
          git rev-parse HEAD > tic-verified-commit.txt
      - name: Preserve repair source and verification evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certivoiq-tic-repair-source-and-tests
          retention-days: 14
          path: |
            src/lib/tic-*
            src/lib/pdf-ocr.ts
            src/utils/tic-certification-intake.functions.ts
            src/utils/tic-certification-review.functions.ts
            src/utils/certification-review.functions.ts
            src/components/tic-*
            src/components/certivoiq-tic-review-form.tsx
            src/components/certification-upload-panel-v4.tsx
            src/components/certification-review-panel.tsx
            scripts/test-tic-*.mjs
            scripts/test-certification-pipeline-performance.mjs
            scripts/test-onboarding-certification-separation.mjs
            scripts/check-tic-supporting-types.mjs
            docs/tic-cell-repair-status.md
            tic-verification.txt
            tic-build.txt
            tic-verified-commit.txt
            tic-generated-route-diff.txt
