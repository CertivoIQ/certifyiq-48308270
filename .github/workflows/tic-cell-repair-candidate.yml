name: TIC cell repair candidate integration
on:
  push:
    branches: [fix/tic-cell-recognition-20260905]
    paths:
      - .github/workflows/tic-cell-repair-candidate.yml
      - scripts/apply-tic-evidence-wiring.mjs
      - scripts/apply-tic-recognition-hardening.mjs
      - scripts/finalize-tic-cell-repair.mjs
      - scripts/check-tic-supporting-types.mjs
      - scripts/test-tic-*.mjs
      - src/lib/tic-supporting-evidence.mjs
      - src/lib/tic-supporting-evidence.d.mts
      - src/components/tic-supporting-evidence-review.tsx
permissions:
  contents: write
concurrency:
  group: tic-cell-repair-candidate
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/fix/tic-cell-recognition-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tic-cell-recognition-20260905
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Apply exact evidence and recognition integration edits
        run: |
          node scripts/apply-tic-evidence-wiring.mjs
          node scripts/apply-tic-recognition-hardening.mjs
          git diff --check
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check strict types for repaired module roots
        run: |
          node scripts/finalize-tic-cell-repair.mjs
          node scripts/check-tic-supporting-types.mjs
      - name: Verify TIC extraction, evidence calculations and intake separation
        run: |
          set -o pipefail
          node --test scripts/test-tic-*.mjs scripts/test-certification-pipeline-performance.mjs scripts/test-onboarding-certification-separation.mjs | tee /tmp/tic-verification.txt
      - name: Build without deployment
        run: |
          set -o pipefail
          npm run build | tee /tmp/tic-build.txt
      - name: Commit verified integration to candidate branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/tic-cell-recognition-20260905'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/certification-review-panel.tsx src/components/certification-upload-panel-v4.tsx src/components/certivoiq-tic-review-form.tsx src/lib/pdf-ocr.ts src/lib/tic-cell-repair.mjs src/lib/tic-field-extraction.ts src/lib/tic-field-registry.ts src/lib/tic-pdf-form-values.ts src/lib/tic-spatial-extraction.mjs src/lib/tic-supporting-document-registry.ts src/utils/certification-review.functions.ts src/utils/tic-certification-intake.functions.ts src/utils/tic-certification-review.functions.ts src/components/tic-calculation-review.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'Connect source-bound supporting calculations and preserve TIC review type'
            git push origin HEAD:fix/tic-cell-recognition-20260905
          fi
          git rev-parse HEAD > /tmp/tic-verified-commit.txt
      - name: Preserve verification evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tic-verification-evidence
          path: |
            /tmp/tic-verification.txt
            /tmp/tic-build.txt
            /tmp/tic-verified-commit.txt
          retention-days: 7
