name: Patch TIC native form extraction

on:
  push:
    paths:
      - '.github/workflows/patch-tic-native-form-extraction.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch
        run: python scripts/apply-tic-native-form-patch.py
      - name: Verify focused regression
        run: |
          node --test scripts/test-tic-native-form-extraction.mjs
          git diff --check
      - name: Commit source patch
        run: |
          git config user.name "CertivoIQ Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/pdf-ocr.ts src/components/certivoiq-tic-review-form.tsx scripts/test-tic-native-form-extraction.mjs
          git commit -m "Prefer native TIC form values before OCR fallback"
          git push origin HEAD:main
