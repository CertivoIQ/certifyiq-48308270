  paid-license-database-rehearsal:
    name: Paid license database rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: certivoiq_rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d certivoiq_rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: certivoiq_rehearsal
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Bootstrap Supabase-compatible roles and base tables
        run: psql --set ON_ERROR_STOP=1 --file supabase/tests/paid_license_database_integrity.bootstrap.sql
      - name: Apply paid-license integrity migration
        run: psql --set ON_ERROR_STOP=1 --file supabase/migrations/20260831201500_paid_license_database_integrity.sql
      - name: Run rolled-back paid-license database rehearsal
        run: psql --set ON_ERROR_STOP=1 --file supabase/tests/paid_license_database_integrity.test.sql
      - name: Bootstrap existing recovery-code schema
        run: |
          psql --set ON_ERROR_STOP=1 --file supabase/tests/mfa_recovery_boundary.bootstrap.sql
          psql --set ON_ERROR_STOP=1 --file supabase/migrations/20260806221712_9f023f95-da52-4f42-90e4-c35cdc74f759.sql
      - name: Apply and verify recovery-code security boundary
        run: |
          psql --set ON_ERROR_STOP=1 --file supabase/migrations/20260910035616_harden_mfa_recovery_code_writes.sql
          psql --set ON_ERROR_STOP=1 --file supabase/tests/mfa_recovery_boundary.test.sql
      - name: Rehearse enrolled MFA across REST and Storage
        run: |
          psql --set ON_ERROR_STOP=1 --file supabase/tests/session_assurance.bootstrap.sql
          psql --set ON_ERROR_STOP=1 --file supabase/migrations/20260906080303_seven_day_session_and_trial_calculator_access.sql
          psql --set ON_ERROR_STOP=1 --file supabase/migrations/20260910155107_enforce_enrolled_mfa_access.sql
          psql --set ON_ERROR_STOP=1 --file supabase/tests/session_assurance.test.sql
          psql --set ON_ERROR_STOP=1 --file supabase/tests/session_assurance_storage.test.sql
