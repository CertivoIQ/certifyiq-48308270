name: CertivoIQ Compliance Intelligence CI

on:
  push:
    branches:
      [
        main,
        launch/aug15-readiness,
        agent/compliance-intelligence-suite,
        fix/pricing-production-banner,
        feat/pricing-comparison-table,
        fix/public-pricing-route,
      ]
  pull_request:
    branches: [main, agent/compliance-intelligence-suite]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Full compliance, HFA authority, SupportIQ, language, launch, and workspace tests
        run: |
          set -e
          node --test scripts/test-workspace-program-routing.mjs
          node --test scripts/test-pha-family-reexamination-workflow.mjs
          node --test scripts/test-pha-family-calculation-engine.mjs
          node --test scripts/test-pha-authoritative-control-state.mjs
          node --test scripts/test-pha-role-access.mjs
          node --test scripts/test-pha-user-invitations.mjs
          bun run test:compliance
          bun run test:slice
          bun run test:orchestrator
          bun run test:federal-packs
          node --test scripts/test-federal-controlled-source-activation.mjs
          node --test scripts/test-local-property-overlay-intake.mjs
          node --test scripts/test-compliance-source-status.mjs
          node --test scripts/test-west-virginia-state-pack-resolution.mjs
          node --test scripts/test-wv-official-index-pipeline.mjs
          node --test scripts/test-wv-lihtc-deterministic-rule-pack.mjs
          node --test scripts/test-wy-lihtc-deterministic-rule-pack.mjs
          node --test scripts/test-wi-lihtc-deterministic-rule-pack.mjs
          node --test scripts/test-wa-lihtc-deterministic-rule-pack.mjs
          node --test scripts/test-vt-lihtc-ait-rule-pack.mjs
          node --test scripts/test-tx-lihtc-monitoring-rule-pack.mjs
          node --test scripts/test-tn-lihtc-monitoring-rule-pack.mjs
          node --test scripts/test-sc-lihtc-compliance-rule-pack.mjs
          node --test scripts/test-sd-lihtc-program-rule-pack.mjs
          node --test scripts/test-ri-lihtc-compliance-rule-pack.mjs
          node --test scripts/test-pa-lihtc-compliance-rule-pack.mjs
          node --test scripts/test-or-lihtc-compliance-rule-pack.mjs
          node --test scripts/test-ok-lihtc-compliance-rule-pack.mjs
          node --test scripts/test-oh-lihtc-compliance-rule-pack.mjs
          node --test scripts/test-nc-lihtc-compliance-rule-pack.mjs
          node --test scripts/test-nd-lihtc-compliance-rule-pack.mjs
          node --test scripts/test-nh-lihtc-compliance-rule-pack.mjs
          node --test scripts/test-nj-lihtc-compliance-rule-pack.mjs
          node --test scripts/test-ny-scoped-lihtc-compliance-rule-pack.mjs
          node --test scripts/test-mo-lihtc-compliance-rule-pack.mjs
          node --test scripts/test-external-state-pack-attestation.mjs
          bun run test:mfh-hotma
          bun run test:mfh-hotma-operations
          bun run test:pha-hotma
          bun run test:billing
          bun run test:layered
          bun run test:tenant
          bun run test:recert
          bun run test:limits
          bun run test:limits-storage
          bun run test:xlsx
          bun run test:project-authority
          bun run test:state-pack
          bun run test:property-figures
          bun run test:state-source-batch
          bun run test:state-source-batch-2
          bun run test:state-source-batch-3
          bun run test:state-source-batch-4
          bun run test:state-source-batch-5
          bun run test:state-source-batch-6
          bun run test:state-source-batch-7
          bun run test:state-source-batch-8
          bun run test:state-source-batch-9
          bun run test:state-source-batch-10
          bun run test:state-source-batch-11
          bun run test:state-source-batch-12
          bun run test:state-source-batch-13
          bun run test:state-source-batch-final
          bun run test:state-source-audit
          node --test scripts/test-nationwide-state-source-discovery.mjs
          node --test scripts/test-nationwide-state-source-evidence-pipeline.mjs
          bun run test:state-source-wv
          bun run test:state-source-wy
          bun run test:state-source-wi
          bun run test:state-source-wa
          bun run test:state-source-va
          bun run test:state-source-vi
          bun run test:state-source-vt
          bun run test:state-source-ut
          bun run test:state-source-tx
          bun run test:state-source-tn
          bun run test:state-source-sd
          bun run test:state-source-id-nm-hi-gu
          node --test scripts/test-south-carolina-source-audit.mjs
          node --test scripts/test-ga-fl-dc-de-source-audit.mjs
          node --test scripts/test-ct-co-ca-ar-source-audit.mjs
          node --test scripts/test-az-ak-al-source-audit.mjs
          node --test scripts/test-ks-ia-in-il-source-audit.mjs
          bun run test:operations-source
          node --test scripts/test-certification-authority.mjs
          node --test scripts/test-transmission-authority.mjs
          node --test scripts/test-hfa-submit-transition.mjs
          node --test scripts/test-delivery-receipt.mjs
          node --test scripts/test-support-triage.mjs
          node --test scripts/test-customer-facing-language.mjs
          node --test scripts/test-organization-email.mjs
          node --test scripts/test-first-sale-monitor.mjs
          node --test scripts/test-escalation-only-autonomy.mjs
          node --test scripts/test-launch-readiness.mjs
      - name: Lint
        run: bun run lint
      - name: Production build
        run: bun run build
