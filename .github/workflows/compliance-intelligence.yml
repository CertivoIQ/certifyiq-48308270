name: CertivoIQ Compliance Intelligence CI

on:
  push:
    branches:
      - agent/compliance-intelligence-suite
      - fix/pricing-production-banner
      - feat/pricing-comparison-table
      - fix/public-pricing-route
  pull_request:
    branches:
      - main
      - agent/compliance-intelligence-suite

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Diagnose repository and runtime
        run: |
          set -e
          echo "=== CERTIVOIQ CI ENVIRONMENT ==="
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_REF_NAME=$GITHUB_REF_NAME"
          echo "GITHUB_WORKFLOW_SHA=$GITHUB_WORKFLOW_SHA"
          git rev-parse HEAD
          git status --short
          node --version
          bun --version
          echo "=== FILE CHECKSUMS ==="
          sha256sum package.json
          sha256sum bun.lock
          echo "=== PACKAGE MANIFEST ==="
          cat package.json
          echo "=== LOCKFILE HEADER ==="
          head -20 bun.lock
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Domain tests
        run: |
          if grep -q '"test:compliance"' package.json; then
            bun run test:compliance
          else
            echo "Compliance Intelligence test script is not present on this branch; skipping domain tests."
          fi
      - name: Lint
        run: bun run lint
      - name: Production build
        run: bun run build
