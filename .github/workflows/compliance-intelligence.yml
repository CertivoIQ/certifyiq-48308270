name: CertivoIQ Compliance Intelligence CI

on:
  push:
    branches:
      [
        main,
        launch/aug15-readiness,
        agent/compliance-intelligence-suite,
        fix/pricing-production-banner,
        feat/pricing-comparison-table,
        fix/public-pricing-route,
      ]
  pull_request:
    branches: [main, agent/compliance-intelligence-suite]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Full compliance, HFA authority, SupportIQ, language, launch, and workspace tests
