name: CertivoIQ Compliance Intelligence CI

on:
  push:
    branches:
      - main
      - agent/compliance-intelligence-suite
      - fix/pricing-production-banner
      - feat/pricing-comparison-table
      - fix/public-pricing-route
  pull_request:
    branches:
      - main
      - agent/compliance-intelligence-suite
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize FREE review marketing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          extensions = {'.ts', '.tsx', '.md', '.mdx', '.json', '.html', '.txt'}
          replacements = [
              ('Start 7-day trial', 'Start with 3 FREE certification reviews'),
              ('start 7-day trial', 'start with 3 FREE certification reviews'),
              ('7-day free trial', '3 FREE certification reviews'),
              ('7-day trial', '3 FREE certification reviews'),
              ('7 day free trial', '3 FREE certification reviews'),
              ('7 day trial', '3 FREE certification reviews'),
              ('Review 3 files free', 'Review 3 files FREE'),
              ('Run 3 free certification reviews', 'Run 3 FREE certification reviews'),
              ('Run 3 free reviews', 'Run 3 FREE reviews'),
              ('Run free reviews', 'Run FREE reviews'),
              ('three free certification reviews', 'three FREE certification reviews'),
              ('three free reviews', 'three FREE reviews'),
              ('3 free certification reviews', '3 FREE certification reviews'),
              ('3 free reviews', '3 FREE reviews'),
              ('3 Free Certification Reviews', '3 FREE Certification Reviews'),
              ('3 Free certification reviews', '3 FREE certification reviews'),
              ('free certification reviews', 'FREE certification reviews'),
          ]

          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix not in extensions:
                  continue
              if '.git' in path.parts or 'node_modules' in path.parts or '.github' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          print('\n'.join(changed) if changed else '(none)')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: replace trial marketing with FREE review offer'
            git push
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Diagnose repository and runtime
        run: |
          set -e
          echo "=== CERTIVOIQ CI ENVIRONMENT ==="
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_REF_NAME=$GITHUB_REF_NAME"
          echo "GITHUB_WORKFLOW_SHA=$GITHUB_WORKFLOW_SHA"
          git rev-parse HEAD
          git status --short
          node --version
          bun --version
          echo "=== FILE CHECKSUMS ==="
          sha256sum package.json
          sha256sum bun.lock
          echo "=== PACKAGE MANIFEST ==="
          cat package.json
          echo "=== LOCKFILE HEADER ==="
          head -20 bun.lock
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Full compliance, HFA authority, and SupportIQ tests
        run: |
          set -e
          bun run test:compliance
          bun run test:slice
          node --test scripts/test-certification-authority.mjs
          node --test scripts/test-transmission-authority.mjs
          node --test scripts/test-hfa-submit-transition.mjs
          node --test scripts/test-delivery-receipt.mjs
          node --test scripts/test-support-triage.mjs
      - name: Lint
        run: bun run lint
      - name: Production build
        run: bun run build
