name: CertivoIQ Compliance Intelligence CI

on:
  push:
    branches:
      - agent/compliance-intelligence-suite
  pull_request:
    branches:
      - main
      - agent/compliance-intelligence-suite

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Domain tests
        run: bun test scripts/test-compliance-intelligence.mjs
      - name: Lint
        run: bun run lint
      - name: Production build
        run: bun run build
