name: Native Income Calculator release
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/native-income-calculator-release.yml'
      - 'src/components/income-calculator.tsx'
      - 'src/components/app-shell.tsx'
      - 'src/routes/_authenticated/income-calculator.tsx'
      - 'supabase/functions/_shared/income-calculator-engine.ts'
      - 'supabase/functions/income-calculator/**'
      - 'scripts/*income*.mjs'
      - 'src/**'
      - 'scripts/test-onboarding-handoff.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-income-calculator-release.yml'
      - 'src/components/income-calculator.tsx'
      - 'src/routes/_authenticated/income-calculator.tsx'
      - 'supabase/functions/_shared/income-calculator-engine.ts'
      - 'supabase/functions/income-calculator/**'
      - 'scripts/*income*.mjs'
      - 'src/**'
      - 'scripts/test-onboarding-handoff.mjs'
permissions:
  contents: read
concurrency:
  group: certivoiq-income-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'bound-v11-release' }}
  cancel-in-progress: false
jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      TARGET_WORKER: certivoiq-launch-candidate-20260905-v11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.4.5
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Calculator and certification regressions
        run: |
          set -euo pipefail
          node --test scripts/test-portfolio-onboarding-mapping.mjs scripts/test-portfolio-vacancies.mjs
          node --test scripts/test-native-income-calculator.mjs | tee /tmp/income-calculator-tests.txt
          node --test scripts/test-income-release-identity.mjs | tee /tmp/income-release-tests.txt
          node --test scripts/test-tic-spatial-extraction.mjs scripts/test-tic-native-form-extraction.mjs scripts/test-command-center-certification-actions.mjs scripts/test-standalone-supporting-document-upload.mjs scripts/test-controlled-mass-portfolio-intake.mjs scripts/test-onboarding-certification-separation.mjs scripts/test-certification-task-workflow.mjs | tee /tmp/income-certification-tests.txt
          node --test scripts/test-onboarding-handoff.mjs | tee /tmp/income-onboarding-tests.txt
          node --experimental-strip-types --test scripts/test-training.mjs
          node scripts/test-ocr-sidecar.mjs
          deno check --config supabase/functions/income-calculator/deno.json supabase/functions/income-calculator/index.ts
      - name: Include source identity in Vite and Nitro public asset manifest
        run: node scripts/verify-native-income-calculator-release.mjs identity
      - name: Build exact checked-out application
        run: bun run build
      - name: Require a completely clean strict application typecheck
        run: |
          set -euo pipefail
          node node_modules/typescript/bin/tsc --noEmit --pretty false | tee /tmp/income-application-typecheck.txt
          printf '{"fullApplicationTypecheckClean":true,"diagnostics":0}\n' > /tmp/income-type-gate.json
      - name: Record release identity and prepare existing bound-worker configuration
        run: |
          node scripts/verify-native-income-calculator-release.mjs prepare
          node scripts/prepare-cloudflare-candidate-config.mjs .output/server/wrangler.json .output/server/wrangler.bound.json "$TARGET_WORKER"
      - name: Verify existing Cloudflare deployment before publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-native-income-calculator-release.mjs preflight
      - name: Deploy to existing domain-bound Cloudflare worker
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          npx --yes wrangler@4 deploy --keep-vars --config .output/server/wrangler.bound.json 2>&1 | tee "$log_file"
          candidate_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$log_file" | tail -n 1 || true)"
          test -n "$candidate_url"
          echo "candidate_url=$candidate_url" >> "$GITHUB_OUTPUT"
      - name: Verify active deployment and preserve domain and binding configuration
        if: steps.deploy.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-native-income-calculator-release.mjs postflight
      - name: Verify live code identity on worker and both public domains
        if: steps.deploy.outcome == 'success'
        env:
          LIVE_URL: ${{ steps.deploy.outputs.candidate_url }}
        run: |
          set -euo pipefail
          node scripts/verify-cloudflare-live-response.mjs "$LIVE_URL"
          node scripts/verify-native-income-calculator-release.mjs live "$LIVE_URL"
      - name: Retain validation and release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-income-calculator-release-evidence
          path: |
            /tmp/income-application-typecheck.txt
            /tmp/income-type-gate.json
            /tmp/income-*-tests.txt
            income-build-verification.json
            income-cloudflare-before.json
            income-cloudflare-after.json
            income-live-verification.json
          if-no-files-found: warn
          retention-days: 14

