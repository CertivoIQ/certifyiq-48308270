name: Temporary PHA final pronunciation fix

on:
  push:
    branches:
      - temp/voice-audio-bridge-20260901
    paths:
      - .github/workflows/temp-pha-final-pronunciation-fix.yml

permissions:
  contents: read

jobs:
  fetch-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Download corrected PHA voice pieces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pha-final
          curl --fail --location --retry 3 --output pha-final/01-prefix.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/f9692321-756e-4d38-b1c7-e4696fd14b03.mp3'
          curl --fail --location --retry 3 --output pha-final/01-suffix.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/14173a44-733f-4aa8-b98d-8343b9a85036.mp3'
          curl --fail --location --retry 3 --output pha-final/05-prefix.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/5c97b20b-607b-4bf2-ae41-be1c44b42a08.mp3'
          curl --fail --location --retry 3 --output pha-final/05-suffix.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/e8964f29-8bc7-4f6f-b657-e4dc92de1513.mp3'
          curl --fail --location --retry 3 --output pha-final/09.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/683917ff-c0e1-43bc-87db-93e2bb5c7a8d.mp3'
          curl --fail --location --retry 3 --output pha-final/10-redeem.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/b325352e-0be8-423f-9985-c40bdb788732.mp3'
          curl --fail --location --retry 3 --output pha-final/10-website.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/16bcb52f-f9d1-4136-8bec-fbb7f0a1e547.mp3'
          curl --fail --location --retry 3 --output pha-final/10-tagline.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/59f6c11f-5104-46de-ad11-d0efb4686b2d.mp3'
          for f in pha-final/*.mp3; do test -s "$f"; file "$f"; done
      - name: Upload corrected PHA voice pieces
        uses: actions/upload-artifact@v4
        with:
          name: pha-final-pronunciation-pieces
          path: pha-final/*.mp3
          if-no-files-found: error
          retention-days: 1
