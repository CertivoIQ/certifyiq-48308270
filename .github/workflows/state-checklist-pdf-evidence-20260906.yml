name: State checklist PDF continuation 20260906
on:
  push:
    branches: [research/state-pack-pdf-evidence-20260906]
    paths:
      - .github/workflows/state-checklist-pdf-evidence-20260906.yml
      - scripts/continue-state-checklist-evidence-20260906.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: state-checklist-continuation-research
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y poppler-utils)
      - name: Capture scoped original PDFs without database writes or approvals
        run: python3 scripts/continue-state-checklist-evidence-20260906.py
      - name: Retain compact manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checklist-continuation-manifest
          path: artifacts/checklist-continuation-20260906/manifest.json
          retention-days: 90
          if-no-files-found: warn
      - name: Retain New York and Northeast original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checklist-continuation-northeast-pdfs
          path: |
            artifacts/checklist-continuation-20260906/NY/
            artifacts/checklist-continuation-20260906/NH/
            artifacts/checklist-continuation-20260906/PA/
            artifacts/checklist-continuation-20260906/MA/
            artifacts/checklist-continuation-20260906/ME/
          retention-days: 90
          if-no-files-found: warn
      - name: Retain other original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checklist-continuation-other-pdfs
          path: |
            artifacts/checklist-continuation-20260906/AK/
            artifacts/checklist-continuation-20260906/IL/
            artifacts/checklist-continuation-20260906/WA/
            artifacts/checklist-continuation-20260906/KS/
            artifacts/checklist-continuation-20260906/WI/
            artifacts/checklist-continuation-20260906/MI/
            artifacts/checklist-continuation-20260906/MT/
            artifacts/checklist-continuation-20260906/OR/
            artifacts/checklist-continuation-20260906/AZ/
            artifacts/checklist-continuation-20260906/FL/
            artifacts/checklist-continuation-20260906/AL/
            artifacts/checklist-continuation-20260906/CA/
            artifacts/checklist-continuation-20260906/TN/
            artifacts/checklist-continuation-20260906/TX/
            artifacts/checklist-continuation-20260906/NE/
            artifacts/checklist-continuation-20260906/SD/
          retention-days: 90
          if-no-files-found: warn
