name: Patch review queue to confirmed TIC facts

on:
  push:
    paths:
      - '.github/workflows/patch-confirmed-tic-review.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace legacy review import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/certification-review-panel.tsx')
          text = path.read_text()
          old = """import {\n  getCertificationReview,\n  recordFindingDecision,\n  runCertificationReview,\n} from '@/utils/certification-review.functions';\n"""
          new = """import {\n  getCertificationReview,\n  recordFindingDecision,\n} from '@/utils/certification-review.functions';\nimport { runCertificationReview } from '@/utils/tic-certification-review.functions';\n"""
          if old not in text:
              raise SystemExit('Expected legacy review import was not found; refusing to patch.')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit exact import change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CertivoIQ Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/certification-review-panel.tsx
          git diff --cached --check
          git commit -m 'Use confirmed TIC facts for compliance review'
          git push origin HEAD:main
