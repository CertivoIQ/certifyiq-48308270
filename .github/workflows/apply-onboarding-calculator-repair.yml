name: Apply verified onboarding and type repair
on:
  push:
    branches: [fix/onboarding-calculator-acceptance]
    paths: ['.github/workflows/apply-onboarding-calculator-repair.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/onboarding-calculator-acceptance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.3 }
      - name: Verify exact local edits against original and resulting file hashes
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          encoded=''.join(pathlib.Path('.repair-transfer/part%d.b64'%i).read_text().strip() for i in (1,2,3))
          raw=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='e626e2da403b6df2e4032bdae41aa9b853c39efa67b696eb17499e5d0ffc4280'
          edits=json.loads(raw); assert len(edits)==43
          paths=[]
          for item in edits:
            p=pathlib.Path(item['path'])
            assert p.parts[0] in ('src','scripts','docs') and '..' not in p.parts and not p.is_absolute() and not p.is_symlink()
            if item['base'] is None:
              assert not p.exists(); text=item['content']
            else:
              original=p.read_bytes(); assert hashlib.sha256(original).hexdigest()==item['base'],str(p)+' original mismatch'
              lines=original.decode().splitlines(keepends=True)
              for start,end,replacement in reversed(item['changes']): lines[start:end]=[replacement]
              text=''.join(lines)
            output=text.encode(); assert hashlib.sha256(output).hexdigest()==item['after'],str(p)+' result mismatch'
            p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(output);paths.append(str(p))
          subprocess.run(['git','add','--',*paths],check=True)
          print('Validated and staged',len(paths),'source, documentation, and test files.')
          PY
      - name: Install frozen toolchain
        run: bun install --frozen-lockfile
      - name: Strict application types and targeted regressions
        run: |
          set -euo pipefail
          node node_modules/typescript/bin/tsc --noEmit --pretty false
          node --test scripts/test-native-income-calculator.mjs scripts/test-income-release-identity.mjs scripts/test-onboarding-handoff.mjs scripts/test-tic-spatial-extraction.mjs scripts/test-tic-native-form-extraction.mjs scripts/test-command-center-certification-actions.mjs scripts/test-standalone-supporting-document-upload.mjs scripts/test-controlled-mass-portfolio-intake.mjs scripts/test-onboarding-certification-separation.mjs scripts/test-certification-task-workflow.mjs
          git diff --cached --check
      - name: Preserve published history with a new source commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix organization onboarding handoff and all strict application type errors; add isolated browser acceptance'
          git push origin HEAD:fix/onboarding-calculator-acceptance
