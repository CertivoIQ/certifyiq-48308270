# Retrigger after generated-row regression alignment.
name: CertivoIQ structured TIC bound-worker candidate

on:
  push:
    paths:
      - '.github/workflows/cloudflare-v6-onboarding-parity.yml'

permissions:
  contents: read

jobs:
  build-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: certivoiq-launch-candidate-20260905-v11

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Require exact structured TIC source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          grep -F -q 'certification-upload-panel-v4' src/routes/upload-certification.tsx
          grep -F -q 'OCR_SIDECAR_STORAGE_MIME = "application/octet-stream"' src/components/certification-upload-panel-v4.tsx
          grep -F -q 'CertivoIqTicReviewForm' src/components/certification-upload-panel-v4.tsx
          grep -F -q 'CERTIVOIQ TENANT INCOME CERTIFICATION' src/components/certivoiq-tic-review-form.tsx
          grep -F -q 'PART I — DEVELOPMENT DATA' src/components/certivoiq-tic-review-form.tsx
          grep -F -q 'PART II — HOUSEHOLD COMPOSITION' src/components/certivoiq-tic-review-form.tsx
          grep -F -q 'PART III — GROSS ANNUAL INCOME' src/components/certivoiq-tic-review-form.tsx
          grep -F -q 'PART IV — INCOME FROM ASSETS' src/components/certivoiq-tic-review-form.tsx
          grep -F -q 'PART V — TOTAL HOUSEHOLD INCOME' src/components/certivoiq-tic-review-form.tsx
          grep -F -q 'PART VI — DETERMINATION OF INCOME ELIGIBILITY' src/components/certivoiq-tic-review-form.tsx
          grep -F -q 'PART VII — RENT' src/components/certivoiq-tic-review-form.tsx
          grep -F -q 'PART VIII — STUDENT STATUS' src/components/certivoiq-tic-review-form.tsx
          grep -F -q 'PART IX — PROGRAM TYPE' src/components/certivoiq-tic-review-form.tsx
          grep -F -q 'TIC_FIELD_DEFINITIONS' src/components/certification-upload-panel-v4.tsx
          grep -F -q 'Save & Start Review' src/components/certification-upload-panel-v4.tsx
          grep -F -q 'annual_student_certification' src/lib/tic-supporting-document-registry.ts
          grep -F -q 'zero_income_certification' src/lib/tic-supporting-document-registry.ts
          grep -F -q 'check_stub' src/lib/tic-supporting-document-registry.ts
          grep -F -q "source_kind in ('packet_page_range','standalone_upload')" supabase/migrations/20260905195900_tic_supporting_documents.sql
          grep -F -q 'attachStandaloneCertificationSupportingDocument' src/components/certification-supporting-documents-panel.tsx
          grep -F -q 'Attach to certification' src/components/certification-supporting-documents-panel.tsx
          ! grep -F -q 'multiple' src/components/certification-supporting-documents-panel.tsx
          grep -F -q 'source_kind: "standalone_upload"' src/utils/certification-supporting-upload.functions.ts
          grep -F -q 'immutable: true' src/utils/certification-supporting-upload.functions.ts
          grep -F -q 'Certifications Awaiting Review' src/components/production-dashboard.tsx
          grep -F -q 'Attach Supporting Document' src/components/production-dashboard.tsx
          grep -F -q 'Review Certification' src/components/production-dashboard.tsx
          grep -F -q 'action?: "support" | "review"' src/routes/files.index.tsx
          grep -F -q 'initialAction' src/components/certification-review-panel.tsx
          grep -F -q 'runQueue.mutate([item.id])' src/components/certification-review-panel.tsx
          grep -F -q "tic-certification-review.functions" src/components/certification-review-panel.tsx
          grep -F -q 'confirmedFactsAuthoritative' src/utils/tic-certification-review.functions.ts
          grep -F -q '.eq("human_verified", true)' src/utils/tic-certification-review.functions.ts
          grep -F -q "const RENDER_SCALE = 3" src/lib/pdf-ocr.ts
          grep -F -q "TESSERACT_VERSION = '7.0.0'" src/lib/pdf-ocr.ts
          grep -F -q 'PSM.SPARSE_TEXT' src/lib/pdf-ocr.ts
          grep -F -q 'First nonblank failed page' src/lib/pdf-ocr.ts
          ! head -n 1 src/components/certivoiq-tic-review-form.tsx | grep -F -q 'eslint-disable react/'
          grep -F -q '[-/]' src/lib/tic-field-extraction.ts
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          echo 'STRUCTURED_TIC_SOURCE_GATE=PASS'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run focused certification regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/test-command-center-certification-actions.mjs
          node --test scripts/test-standalone-supporting-document-upload.mjs
          node --test scripts/test-controlled-mass-portfolio-intake.mjs
          node --test scripts/test-onboarding-certification-separation.mjs
          node scripts/test-ocr-sidecar.mjs
          node --test scripts/test-certification-task-workflow.mjs
          echo 'STRUCTURED_TIC_EVIDENCE_BOUNDARY=PASS'

      - name: Build exact current main
        run: bun run build

      - name: Prepare bound-worker candidate config
        run: |
          node scripts/prepare-cloudflare-candidate-config.mjs \
            .output/server/wrangler.json \
            .output/server/wrangler.bound.json \
            "$TARGET_WORKER"

      - name: Deploy current release to bound v11 worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          npx --yes wrangler@4 deploy --config .output/server/wrangler.bound.json 2>&1 | tee "$log_file"
          candidate_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$log_file" | tail -n 1 || true)"
          test -n "$candidate_url"
          echo "candidate_url=$candidate_url" >> "$GITHUB_OUTPUT"
          echo "Candidate URL: $candidate_url"

      - name: Verify bound v11 live response boundary
        shell: bash
        run: |
          set -euo pipefail
          candidate_url="${{ steps.deploy.outputs.candidate_url }}"
          for attempt in 1 2 3 4 5 6; do
            if node scripts/verify-cloudflare-live-response.mjs "$candidate_url"; then
              echo 'BOUND_V11_STRUCTURED_TIC_LIVE_RESPONSE_GATE=PASS'
              exit 0
            fi
            test "$attempt" -lt 6
            sleep 10
          done

      - name: Confirm domain mapping remains stable
        run: |
          echo 'Existing custom-domain mapping remains on the bound v11 worker; this release updates that worker in place after green CI.'
