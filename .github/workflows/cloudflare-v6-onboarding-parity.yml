name: CertivoIQ v11 complete TIC intake candidate

on:
  push:
    paths:
      - '.github/workflows/cloudflare-v6-onboarding-parity.yml'

permissions:
  contents: read

jobs:
  build-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: certivoiq-launch-candidate-20260905-v11

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Require exact complete TIC intake and OCR source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          grep -F -q 'certification-upload-panel-v2' src/routes/upload-certification.tsx
          grep -F -q 'CertificationUploadPanel' src/routes/upload-certification.tsx
          ! grep -E -q 'PortfolioIntakePanel|PortfolioOnboardingPanel' src/routes/upload-certification.tsx
          grep -F -q 'OCR_SIDECAR_STORAGE_MIME = "application/octet-stream"' src/components/certification-upload-panel-v2.tsx
          grep -F -q 'TIC_FIELD_DEFINITIONS' src/components/certification-upload-panel-v2.tsx
          grep -F -q 'Review and correct the complete TIC before saving' src/components/certification-upload-panel-v2.tsx
          grep -F -q 'sourcePreviewUrl' src/components/certification-upload-panel-v2.tsx
          grep -F -q 'Not extracted — enter if shown on the certification' src/components/certification-upload-panel-v2.tsx
          grep -F -q 'Save & Start Review' src/components/certification-upload-panel-v2.tsx
          grep -F -q 'household_member_1_last_name' src/lib/tic-field-registry.ts
          grep -F -q 'income_member_1_wages_business' src/lib/tic-field-registry.ts
          grep -F -q 'asset_1_cash_value' src/lib/tic-field-registry.ts
          grep -F -q 'all_occupants_full_time_students' src/lib/tic-field-registry.ts
          grep -F -q 'reviewerSuppliedFields' src/utils/tic-certification-intake.functions.ts
          grep -F -q 'REVIEWER_CONFIRMED_PROVIDER' src/utils/tic-certification-intake.functions.ts
          grep -F -q "const RENDER_SCALE = 3" src/lib/pdf-ocr.ts
          grep -F -q "TESSERACT_VERSION = '7.0.0'" src/lib/pdf-ocr.ts
          grep -F -q 'tessdata.projectnaptha.com/4.0.0_best' src/lib/pdf-ocr.ts
          grep -F -q 'visualInkProfile' src/lib/pdf-ocr.ts
          grep -F -q 'looksVisuallyBlank' src/lib/pdf-ocr.ts
          grep -F -q 'PSM.AUTO' src/lib/pdf-ocr.ts
          grep -F -q 'PSM.SPARSE_TEXT' src/lib/pdf-ocr.ts
          grep -F -q 'PSM.SINGLE_BLOCK' src/lib/pdf-ocr.ts
          grep -F -q "user_defined_dpi: '300'" src/lib/pdf-ocr.ts
          grep -F -q 'First nonblank failed page' src/lib/pdf-ocr.ts
          grep -F -q 'if (pages.length === 0)' src/lib/pdf-ocr.ts
          ! grep -F -q 'if (ocrPageCount === 0)' src/lib/pdf-ocr.ts
          grep -F -q 'sourceIdentity.pageCount - pages.length' src/lib/ocr-sidecar.mjs
          ! grep -F -q 'PortfolioIntakePanel' src/components/compliance-intelligence-suite.tsx
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          echo 'COMPLETE_TIC_INTAKE_SOURCE_GATE=PASS'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/test-onboarding-certification-separation.mjs
          node scripts/test-ocr-sidecar.mjs
          node --test scripts/test-dashboard-navigation-access.mjs
          node --test scripts/test-certification-task-workflow.mjs
          node --test scripts/test-controlled-mass-portfolio-intake.mjs

      - name: Build exact current main
        run: bun run build

      - name: Prepare isolated v11 candidate config
        run: |
          node scripts/prepare-cloudflare-candidate-config.mjs \
            .output/server/wrangler.json \
            .output/server/wrangler.v11.json \
            "$TARGET_WORKER"

      - name: Deploy v11 to workers.dev only
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          npx --yes wrangler@4 deploy --config .output/server/wrangler.v11.json 2>&1 | tee "$log_file"
          candidate_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$log_file" | tail -n 1 || true)"
          test -n "$candidate_url"
          echo "candidate_url=$candidate_url" >> "$GITHUB_OUTPUT"
          echo "Candidate URL: $candidate_url"

      - name: Verify v11 live response boundary
        shell: bash
        run: |
          set -euo pipefail
          candidate_url="${{ steps.deploy.outputs.candidate_url }}"
          for attempt in 1 2 3 4 5 6; do
            if node scripts/verify-cloudflare-live-response.mjs "$candidate_url"; then
              echo 'V11_LIVE_RESPONSE_GATE=PASS'
              exit 0
            fi
            test "$attempt" -lt 6
            sleep 10
          done

      - name: Confirm production remains untouched
        run: |
          echo 'Candidate only; no certivoiq.com custom domain, Worker Route, DNS, database, or billing changes were made.'
