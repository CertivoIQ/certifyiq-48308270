name: CertivoIQ certification operations production cutover

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cloudflare-custom-domain-cutover-v5.yml']

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPERATIONS_WORKER_SECRET: ${{ secrets.OPERATIONS_WORKER_SECRET }}
      TARGET_WORKER: certivoiq-launch-candidate-20260905-v11
      TARGET_URL: https://certivoiq-launch-candidate-20260905-v11.rodsheka-watkins.workers.dev
      FALLBACK_WORKER: certivoiq-launch-candidate-20260905-v10
      ZONE_NAME: certivoiq.com

    steps:
      - uses: actions/checkout@v4

      - name: Preflight exact certification operations source and protected runtime
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${OPERATIONS_WORKER_SECRET:-}"
          grep -F -q 'certification-upload-panel-v3' src/routes/upload-certification.tsx
          grep -F -q 'Certifications Awaiting Review' src/components/production-dashboard.tsx
          grep -F -q 'Attach Supporting Document' src/components/production-dashboard.tsx
          grep -F -q 'Review Certification' src/components/production-dashboard.tsx
          grep -F -q 'Attach to certification' src/components/certification-supporting-documents-panel.tsx
          grep -F -q 'source_kind: "standalone_upload"' src/utils/certification-supporting-upload.functions.ts
          grep -F -q 'immutable: true' src/utils/certification-supporting-upload.functions.ts
          grep -F -q 'action?: "support" | "review"' src/routes/files.index.tsx
          grep -F -q 'runQueue.mutate([item.id])' src/components/certification-review-panel.tsx
          grep -F -q "tic-certification-review.functions" src/components/certification-review-panel.tsx
          health="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $OPERATIONS_WORKER_SECRET" "$TARGET_URL/api/internal/runtime-health")"
          echo "TARGET_WORKERS_DEV_HEALTH=$health"
          test "$health" = 204
          node scripts/verify-cloudflare-live-response.mjs "$TARGET_URL"
          echo 'CERTIFICATION_OPERATIONS_PREFLIGHT=PASS'

      - name: Transfer both custom domains to certification release with v10 rollback protection
        shell: bash
        run: |
          set -Eeuo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          api='https://api.cloudflare.com/client/v4'

          curl -fsS "${auth[@]}" "$api/zones?name=$ZONE_NAME&account.id=$CLOUDFLARE_ACCOUNT_ID" -o /tmp/zones.json
          ZONE_ID="$(jq -r 'if .success and (.result|length)==1 then .result[0].id else empty end' /tmp/zones.json)"
          test -n "$ZONE_ID"

          current_id(){
            curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" | jq -r --arg h "$1" '.result[]? | select(.hostname==$h) | .id' | head -n1
          }
          current_service(){
            curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" | jq -r --arg h "$1" '.result[]? | select(.hostname==$h) | .service' | head -n1
          }
          detach_current(){
            host="$1"
            id="$(current_id "$host")"
            if [ -z "$id" ]; then echo "DETACH $host already absent"; return 0; fi
            code="$(curl -sS -X DELETE "${auth[@]}" -o /tmp/detach.out -w '%{http_code}' "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains/$id")"
            echo "DETACH $host HTTP=$code"
            test "$code" = 200
          }
          attach(){
            host="$1"; service="$2"
            body="$(jq -nc --arg h "$host" --arg s "$service" --arg z "$ZONE_ID" --arg zn "$ZONE_NAME" '{hostname:$h,service:$s,zone_id:$z,zone_name:$zn}')"
            code="$(curl -sS -X PUT "${auth[@]}" -H 'Content-Type: application/json' --data "$body" -o /tmp/attach.json -w '%{http_code}' "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
            echo "ATTACH $host -> $service HTTP=$code"
            test "$code" = 200
            jq -e --arg h "$host" --arg s "$service" '.success == true and .result.hostname==$h and .result.service==$s' /tmp/attach.json >/dev/null
          }
          restore_v10(){
            trap - ERR
            set +e
            echo 'ROLLBACK_TO_V10=START'
            for host in certivoiq.com www.certivoiq.com; do
              detach_current "$host" || true
              attach "$host" "$FALLBACK_WORKER" || true
            done
            echo 'ROLLBACK_TO_V10=COMPLETE'
          }
          trap 'restore_v10' ERR

          curl -fsS "${auth[@]}" "$api/zones/$ZONE_ID/workers/routes" -o /tmp/routes-before.json
          jq -e '.success == true and (.result|length)==0' /tmp/routes-before.json >/dev/null
          echo "BEFORE_WWW=$(current_service www.certivoiq.com)"
          echo "BEFORE_APEX=$(current_service certivoiq.com)"
          test "$(current_service www.certivoiq.com)" = "$FALLBACK_WORKER"
          test "$(current_service certivoiq.com)" = "$FALLBACK_WORKER"

          if [ "$(current_service www.certivoiq.com)" != "$TARGET_WORKER" ]; then
            detach_current www.certivoiq.com
            attach www.certivoiq.com "$TARGET_WORKER"
          fi
          test "$(current_service www.certivoiq.com)" = "$TARGET_WORKER"

          www_ready=0
          for i in $(seq 1 20); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' https://www.certivoiq.com/ || true)"
            echo "www public attempt $i HTTP=$code"
            case "$code" in 2*|3*) www_ready=1; break;; esac
            sleep 3
          done
          test "$www_ready" = 1
          node scripts/verify-cloudflare-live-response.mjs https://www.certivoiq.com
          echo 'WWW_CERTIFICATION_RELEASE_MAPPING_AND_REDIRECT=PASS'

          if [ "$(current_service certivoiq.com)" != "$TARGET_WORKER" ]; then
            detach_current certivoiq.com
            attach certivoiq.com "$TARGET_WORKER"
          fi
          test "$(current_service certivoiq.com)" = "$TARGET_WORKER"

          apex_ready=0
          for i in $(seq 1 20); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $OPERATIONS_WORKER_SECRET" https://certivoiq.com/api/internal/runtime-health || true)"
            echo "apex health attempt $i HTTP=$code"
            if [ "$code" = 204 ]; then apex_ready=1; break; fi
            sleep 3
          done
          test "$apex_ready" = 1

          purge_body="$(jq -nc '{hosts:["www.certivoiq.com","certivoiq.com"]}')"
          curl -fsS -X POST "${auth[@]}" -H 'Content-Type: application/json' --data "$purge_body" "$api/zones/$ZONE_ID/purge_cache" -o /tmp/purge.json
          jq -e '.success == true' /tmp/purge.json >/dev/null

          node scripts/verify-cloudflare-live-response.mjs https://certivoiq.com
          node scripts/verify-cloudflare-live-response.mjs https://www.certivoiq.com
          test "$(current_service certivoiq.com)" = "$TARGET_WORKER"
          test "$(current_service www.certivoiq.com)" = "$TARGET_WORKER"
          curl -fsS "${auth[@]}" "$api/zones/$ZONE_ID/workers/routes" -o /tmp/routes-final.json
          jq -e '.success == true and (.result|length)==0' /tmp/routes-final.json >/dev/null

          trap - ERR
          echo "FINAL_APEX_SERVICE=$(current_service certivoiq.com)"
          echo "FINAL_WWW_SERVICE=$(current_service www.certivoiq.com)"
          echo 'CUSTOM_DOMAIN_CUTOVER=PASS certification-release rollback=v10 purge=PASS routes=EMPTY'
