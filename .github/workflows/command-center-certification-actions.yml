name: Command center certification actions

on:
  push:
    branches: [main]
    paths:
      - 'src/components/production-dashboard.tsx'
      - 'src/routes/files.index.tsx'
      - 'src/components/certification-review-panel.tsx'
      - 'src/components/certification-supporting-documents-panel.tsx'
      - 'src/utils/certification-supporting-upload.functions.ts'
      - 'scripts/test-command-center-certification-actions.mjs'
      - '.github/workflows/command-center-certification-actions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run command center certification regression
        run: node --test scripts/test-command-center-certification-actions.mjs
      - name: Production build
        run: bun run build
