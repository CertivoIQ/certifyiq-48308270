name: Cloudflare candidate deploy once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-candidate-deploy-once.yml"

permissions:
  contents: read

# One-time candidate redeploy after Worker-first routing hardening.
jobs:
  deploy-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_CANDIDATE_WORKER_NAME: certivoiq-cutover-candidate-20260903

    steps:
      - name: Require Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is missing."; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is missing."; exit 1; }
          echo "Cloudflare credentials are present (values not displayed)."

      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test candidate config safety gate
        run: node --test scripts/test-cloudflare-candidate-config.mjs

      - name: Test deployment response-header contract
        run: node --test scripts/test-zero-lovable-runtime-boundary.mjs

      - name: Build exact candidate
        run: bun run build

      - name: Prepare isolated candidate Wrangler config
        run: |
          node scripts/prepare-cloudflare-candidate-config.mjs \
            .output/server/wrangler.json \
            .output/server/wrangler.candidate.json \
            "$CLOUDFLARE_CANDIDATE_WORKER_NAME"

      - name: Deploy candidate to workers.dev only
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          npx --yes wrangler@4 deploy \
            --config .output/server/wrangler.candidate.json \
            2>&1 | tee "$log_file"
          candidate_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$log_file" | tail -n 1 || true)"
          if [ -z "$candidate_url" ]; then
            echo "Deployment completed but a workers.dev URL could not be extracted from Wrangler output."
            exit 1
          fi
          echo "candidate_url=$candidate_url" >> "$GITHUB_OUTPUT"
          echo "Candidate URL: $candidate_url"

      - name: Verify live Cloudflare candidate response boundary
        run: node scripts/verify-cloudflare-live-response.mjs "${{ steps.deploy.outputs.candidate_url }}"

      - name: Confirm production isolation
        run: |
          echo "Candidate verification completed."
          echo "No certivoiq.com route, custom domain, DNS record, Supabase data, billing state, or Lovable resource was changed."
