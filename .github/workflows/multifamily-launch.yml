name: Multifamily launch and state billing checks
on:
  pull_request:
    paths: ['src/**', 'scripts/test-multifamily-launch.mjs', 'scripts/test-state-pack-billing.mjs', '.github/workflows/multifamily-launch.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/multifamily-launch.yml']
permissions:
  contents: read
concurrency:
  group: multifamily-launch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - name: Install isolated PostgreSQL test runtime
        run: npm install --prefix /tmp/state-pack-db-tests --no-save --package-lock=false --ignore-scripts @electric-sql/pglite@0.5.8
      - name: Rehearse state purchase database controls
        env:
          PGLITE_TEST_BASE: file:///tmp/state-pack-db-tests/package.json
        run: node scripts/test-state-pack-database.mjs
      - run: bunx tsc --noEmit
      - run: node --test scripts/test-multifamily-launch.mjs scripts/test-state-pack-billing.mjs scripts/test-enterprise-billing-terminal-controls.mjs scripts/test-state-rule-pack-release.mjs
      - run: bun run build
      # native-income-calculator-release.yml publishes main after its complete
      # regression suite and checks the domain mapping, bindings and source SHA.
      # Keep one production publisher to avoid concurrent Worker deployments.
