name: Multifamily launch release
on:
  pull_request:
    paths: ['src/**', 'scripts/test-multifamily-launch.mjs', '.github/workflows/multifamily-launch.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/multifamily-launch.yml']
permissions:
  contents: read
concurrency:
  group: multifamily-launch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: node --test scripts/test-multifamily-launch.mjs scripts/test-enterprise-billing-terminal-controls.mjs scripts/test-state-rule-pack-release.mjs
      - run: bun run build
      - name: Publish tested main release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/prepare-cloudflare-candidate-config.mjs .output/server/wrangler.json .output/server/wrangler.bound.json certivoiq-launch-candidate-20260905-v11
          npx --yes wrangler@4 deploy --config .output/server/wrangler.bound.json
      - name: Verify public deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/verify-cloudflare-live-response.mjs https://certivoiq.com
