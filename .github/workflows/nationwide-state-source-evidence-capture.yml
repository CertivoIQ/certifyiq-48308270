name: Nationwide State Source Evidence Capture

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/lib/nationwide-state-source-discovery.json"
      - "src/lib/nationwide-state-source-evidence-pipeline.mjs"
      - "scripts/capture-nationwide-state-source-evidence.mjs"
      - "scripts/test-nationwide-state-source-evidence-pipeline.mjs"
      - ".github/workflows/nationwide-state-source-evidence-capture.yml"

permissions:
  contents: read

concurrency:
  group: certivoiq-nationwide-state-source-evidence
  cancel-in-progress: false

jobs:
  capture:
    name: Download and hash official state-source candidates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify fail-closed evidence capture controls
        run: node --test scripts/test-nationwide-state-source-evidence-pipeline.mjs
      - name: Download, hash, and extract declared effective-date evidence
        run: node scripts/capture-nationwide-state-source-evidence.mjs
      - name: Upload evidence manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nationwide-state-source-evidence
          path: artifacts/state-source-evidence/*.json
          if-no-files-found: error
          retention-days: 90
