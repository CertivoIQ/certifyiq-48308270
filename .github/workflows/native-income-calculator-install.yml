name: Native Income Calculator integration
on:
  push:
    branches: ['feat/native-income-calculator']
    paths:
      - '.github/workflows/native-income-calculator-install.yml'
      - 'scripts/install-native-income-calculator.mjs'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-income-calculator
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.4.5
      - name: Materialize candidate source only when missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f src/components/income-calculator.tsx || node scripts/install-native-income-calculator.mjs
      - name: Preserve candidate source on isolated feature branch for repair
        run: |
          git config user.name 'CertivoIQ Release Bot'
          git config user.email 'release-bot@certivoiq.com'
          git add docs/native-income-calculator.md scripts/test-native-income-calculator.mjs src/components/income-calculator.tsx src/components/app-shell.tsx src/routes/_authenticated/income-calculator.tsx supabase/functions/_shared/income-calculator-engine.ts supabase/functions/income-calculator/deno.json supabase/functions/income-calculator/index.ts supabase/migrations/20260906025632_native_income_calculator_immutable_records.sql
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve native calculator candidate for integration repair; not a release'
            git push origin HEAD:feat/native-income-calculator
          fi
          git archive --format=tar HEAD -o /tmp/native-income-calculator-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: native-income-calculator-source
          path: /tmp/native-income-calculator-source.tar
          retention-days: 1
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Native calculator regression tests
        run: node --test scripts/test-native-income-calculator.mjs
      - name: Typecheck authenticated Edge Function
        run: deno check --config supabase/functions/income-calculator/deno.json supabase/functions/income-calculator/index.ts
      - name: Build application and generate authenticated route
        run: bun run build
      - name: Full application diagnostics (no suppression)
        run: node_modules/.bin/tsc --noEmit --pretty false > /tmp/calculator-full-types.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-income-calculator-diagnostics
          path: /tmp/calculator-full-types.txt
          retention-days: 1
