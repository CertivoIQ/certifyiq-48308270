name: Native Income Calculator integration
on:
  push:
    branches: ['feat/native-income-calculator']
    paths:
      - '.github/workflows/native-income-calculator-install.yml'
      - 'scripts/repair-native-income-calculator.mjs'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-income-calculator
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.4.5
      - name: Repair strict input types and saved-version loading
        run: |
          if ! grep -q 'function parseSourcedLimits' supabase/functions/_shared/income-calculator-engine.ts; then
            node scripts/repair-native-income-calculator.mjs
          fi
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Independently capture pre-feature application diagnostics
        run: |
          git fetch --no-tags --depth=1 origin 3a662a690d7e02bf5cd6fda16149c964864c0cd4
          git worktree add --detach /tmp/income-baseline 3a662a690d7e02bf5cd6fda16149c964864c0cd4
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/income-baseline/node_modules
          node scripts/check-income-type-baseline.mjs capture /tmp/income-baseline /tmp/income-baseline-types.json
      - name: Native calculator strict regressions and Edge Function check
        run: |
          set -euo pipefail
          node --test scripts/test-native-income-calculator.mjs | tee /tmp/income-calculator-tests.txt
          deno check --config supabase/functions/income-calculator/deno.json supabase/functions/income-calculator/index.ts
      - name: Build application and generate authenticated route
        run: bun run build
      - name: Reject all new diagnostics and require clean calculator and menu types
        run: |
          node scripts/check-income-type-baseline.mjs capture . /tmp/income-current-types.json
          node scripts/check-income-type-baseline.mjs compare /tmp/income-baseline-types.json /tmp/income-current-types.json /tmp/income-type-gate.json
      - name: Commit corrected tested source to feature branch
        run: |
          git config user.name 'CertivoIQ Release Bot'
          git config user.email 'release-bot@certivoiq.com'
          git add scripts/test-native-income-calculator.mjs src/components/income-calculator.tsx src/components/app-shell.tsx src/routeTree.gen.ts supabase/functions/_shared/income-calculator-engine.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Repair native calculator strict typing and preserve saved-version integrity'
            git push origin HEAD:feat/native-income-calculator
          fi
          echo "TESTED_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-income-calculator-validation
          path: |
            /tmp/income-*-types.json
            /tmp/income-type-gate.json
            /tmp/income-calculator-tests.txt
          retention-days: 7
