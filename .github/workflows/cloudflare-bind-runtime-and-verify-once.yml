name: Cloudflare bind runtime and verify once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-bind-runtime-and-verify-once.yml"

permissions:
  contents: read

jobs:
  bind-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_CANDIDATE_WORKER_NAME: certivoiq-cutover-candidate-20260903

    steps:
      - name: Require deployment and runtime sources
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          STRIPE_LIVE_API_KEY: ${{ secrets.STRIPE_LIVE_API_KEY }}
          VITE_PAYMENTS_CLIENT_TOKEN: ${{ secrets.VITE_PAYMENTS_CLIENT_TOKEN }}
          PAYMENTS_LIVE_WEBHOOK_SECRET: ${{ secrets.PAYMENTS_LIVE_WEBHOOK_SECRET }}
          STRIPE_MULTIFAMILY_ENTERPRISE_PRICE_ID_LIVE: ${{ secrets.STRIPE_MULTIFAMILY_ENTERPRISE_PRICE_ID_LIVE }}
          STRIPE_PHA_PRICE_ID_LIVE: ${{ secrets.STRIPE_PHA_PRICE_ID_LIVE }}
          OPERATIONS_WORKER_SECRET: ${{ secrets.OPERATIONS_WORKER_SECRET }}
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
            SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY
            STRIPE_LIVE_API_KEY VITE_PAYMENTS_CLIENT_TOKEN PAYMENTS_LIVE_WEBHOOK_SECRET
            STRIPE_MULTIFAMILY_ENTERPRISE_PRICE_ID_LIVE STRIPE_PHA_PRICE_ID_LIVE
            OPERATIONS_WORKER_SECRET
          )
          for name in "${required[@]}"; do
            test -n "${!name:-}" || { echo "$name is missing"; exit 1; }
          done
          test "$SUPABASE_URL" = "$VITE_SUPABASE_URL" || { echo "Supabase URL values do not match"; exit 1; }
          [[ "$STRIPE_LIVE_API_KEY" =~ ^(sk|rk)_live_[A-Za-z0-9]+$ ]] || { echo "Stripe live API key format is invalid"; exit 1; }
          [[ "$VITE_PAYMENTS_CLIENT_TOKEN" =~ ^pk_live_[A-Za-z0-9]+$ ]] || { echo "Stripe publishable key is not live"; exit 1; }
          [[ "$PAYMENTS_LIVE_WEBHOOK_SECRET" =~ ^whsec_[A-Za-z0-9]+$ ]] || { echo "Stripe webhook secret format is invalid"; exit 1; }
          [[ "$STRIPE_MULTIFAMILY_ENTERPRISE_PRICE_ID_LIVE" =~ ^price_[A-Za-z0-9]+$ ]] || exit 1
          [[ "$STRIPE_PHA_PRICE_ID_LIVE" =~ ^price_[A-Za-z0-9]+$ ]] || exit 1
          echo "PASS: deployment/runtime sources present; values not displayed."

      - name: Validate Supabase and Stripe credentials read-only
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          STRIPE_LIVE_API_KEY: ${{ secrets.STRIPE_LIVE_API_KEY }}
          STRIPE_MULTIFAMILY_ENTERPRISE_PRICE_ID_LIVE: ${{ secrets.STRIPE_MULTIFAMILY_ENTERPRISE_PRICE_ID_LIVE }}
          STRIPE_PHA_PRICE_ID_LIVE: ${{ secrets.STRIPE_PHA_PRICE_ID_LIVE }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --output /dev/null \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            "${SUPABASE_URL%/}/rest/v1/"
          curl --fail --silent --show-error --output /dev/null \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" \
            "${VITE_SUPABASE_URL%/}/auth/v1/settings"

          curl --fail --silent --show-error \
            -u "${STRIPE_LIVE_API_KEY}:" \
            https://api.stripe.com/v1/account \
            --output /tmp/stripe-account.json
          node -e 'const a=require("/tmp/stripe-account.json"); if (!a || !a.id) process.exit(1)'

          for price_id in "$STRIPE_MULTIFAMILY_ENTERPRISE_PRICE_ID_LIVE" "$STRIPE_PHA_PRICE_ID_LIVE"; do
            curl --fail --silent --show-error \
              -u "${STRIPE_LIVE_API_KEY}:" \
              "https://api.stripe.com/v1/prices/${price_id}" \
              --output /tmp/stripe-price.json
            node -e 'const p=require("/tmp/stripe-price.json"); if (p.active !== true || p.livemode !== true) process.exit(1)'
          done
          rm -f /tmp/stripe-account.json /tmp/stripe-price.json
          echo "PASS: Supabase and Stripe production credentials validated read-only."

      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test Cloudflare safety contracts
        run: |
          node --test scripts/test-cloudflare-candidate-config.mjs
          node --test scripts/test-zero-lovable-runtime-boundary.mjs

      - name: Build candidate with public production client configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PAYMENTS_CLIENT_TOKEN: ${{ secrets.VITE_PAYMENTS_CLIENT_TOKEN }}
        run: bun run build

      - name: Verify public build contains public config and no server secrets
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PAYMENTS_CLIENT_TOKEN: ${{ secrets.VITE_PAYMENTS_CLIENT_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_LIVE_API_KEY: ${{ secrets.STRIPE_LIVE_API_KEY }}
          PAYMENTS_LIVE_WEBHOOK_SECRET: ${{ secrets.PAYMENTS_LIVE_WEBHOOK_SECRET }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = '.output/public';
          const chunks = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else {
                try { chunks.push(fs.readFileSync(full, 'utf8')); } catch {}
              }
            }
          }
          walk(root);
          const corpus = chunks.join('\n');
          for (const name of ['VITE_SUPABASE_URL','VITE_SUPABASE_PUBLISHABLE_KEY','VITE_PAYMENTS_CLIENT_TOKEN']) {
            const value = process.env[name];
            if (!value || !corpus.includes(value)) throw new Error(`${name} was not embedded in the public build`);
          }
          for (const name of ['SUPABASE_SERVICE_ROLE_KEY','STRIPE_LIVE_API_KEY','PAYMENTS_LIVE_WEBHOOK_SECRET']) {
            const value = process.env[name];
            if (value && corpus.includes(value)) throw new Error(`${name} leaked into the public build`);
          }
          console.log('PASS: public build boundary verified.');
          NODE

      - name: Prepare isolated candidate Wrangler config
        run: |
          node scripts/prepare-cloudflare-candidate-config.mjs \
            .output/server/wrangler.json \
            .output/server/wrangler.candidate.json \
            "$CLOUDFLARE_CANDIDATE_WORKER_NAME"

      - name: Deploy rebuilt candidate to workers.dev only
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          npx --yes wrangler@4 deploy \
            --config .output/server/wrangler.candidate.json \
            2>&1 | tee "$log_file"
          candidate_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$log_file" | tail -n 1 || true)"
          rm -f "$log_file"
          test -n "$candidate_url" || { echo "workers.dev URL not found"; exit 1; }
          echo "candidate_url=$candidate_url" >> "$GITHUB_OUTPUT"
          echo "Candidate URL: $candidate_url"

      - name: Bind production runtime secrets to candidate
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          STRIPE_LIVE_API_KEY: ${{ secrets.STRIPE_LIVE_API_KEY }}
          VITE_PAYMENTS_CLIENT_TOKEN: ${{ secrets.VITE_PAYMENTS_CLIENT_TOKEN }}
          PAYMENTS_LIVE_WEBHOOK_SECRET: ${{ secrets.PAYMENTS_LIVE_WEBHOOK_SECRET }}
          STRIPE_MULTIFAMILY_ENTERPRISE_PRICE_ID_LIVE: ${{ secrets.STRIPE_MULTIFAMILY_ENTERPRISE_PRICE_ID_LIVE }}
          STRIPE_PHA_PRICE_ID_LIVE: ${{ secrets.STRIPE_PHA_PRICE_ID_LIVE }}
          STRIPE_BILLING_PORTAL_CONFIGURATION_ID_LIVE: ${{ secrets.STRIPE_BILLING_PORTAL_CONFIGURATION_ID_LIVE }}
          PAYMENTS_LIVE_VERIFIED: ${{ secrets.PAYMENTS_LIVE_VERIFIED }}
          OPERATIONS_WORKER_SECRET: ${{ secrets.OPERATIONS_WORKER_SECRET }}
          SUPPORT_EMAIL_WEBHOOK_SECRET: ${{ secrets.SUPPORT_EMAIL_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          secret_file="$(mktemp)"
          SECRET_FILE="$secret_file" node <<'NODE'
          const fs = require('fs');
          const required = [
            'SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY','VITE_SUPABASE_URL','VITE_SUPABASE_PUBLISHABLE_KEY',
            'STRIPE_LIVE_API_KEY','VITE_PAYMENTS_CLIENT_TOKEN','PAYMENTS_LIVE_WEBHOOK_SECRET',
            'STRIPE_MULTIFAMILY_ENTERPRISE_PRICE_ID_LIVE','STRIPE_PHA_PRICE_ID_LIVE','OPERATIONS_WORKER_SECRET'
          ];
          const optional = [
            'STRIPE_BILLING_PORTAL_CONFIGURATION_ID_LIVE','PAYMENTS_LIVE_VERIFIED','SUPPORT_EMAIL_WEBHOOK_SECRET'
          ];
          const payload = {};
          for (const name of required) {
            if (!process.env[name]) throw new Error(`${name} is missing`);
            payload[name] = process.env[name];
          }
          for (const name of optional) if (process.env[name]) payload[name] = process.env[name];
          fs.writeFileSync(process.env.SECRET_FILE, JSON.stringify(payload), { mode: 0o600 });
          NODE
          npx --yes wrangler@4 secret bulk "$secret_file" --name "$CLOUDFLARE_CANDIDATE_WORKER_NAME"
          rm -f "$secret_file"

      - name: Verify candidate secret-name inventory
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 secret list --name "$CLOUDFLARE_CANDIDATE_WORKER_NAME" --format json > /tmp/secret-list.json
          node <<'NODE'
          const fs = require('fs');
          const required = new Set([
            'SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY','VITE_SUPABASE_URL','VITE_SUPABASE_PUBLISHABLE_KEY',
            'STRIPE_LIVE_API_KEY','VITE_PAYMENTS_CLIENT_TOKEN','PAYMENTS_LIVE_WEBHOOK_SECRET',
            'STRIPE_MULTIFAMILY_ENTERPRISE_PRICE_ID_LIVE','STRIPE_PHA_PRICE_ID_LIVE','OPERATIONS_WORKER_SECRET'
          ]);
          const rows = JSON.parse(fs.readFileSync('/tmp/secret-list.json','utf8'));
          const present = new Set(rows.map((row) => row.name));
          const missing = [...required].filter((name) => !present.has(name));
          if (missing.length) throw new Error(`Candidate is missing required Cloudflare secret names: ${missing.join(', ')}`);
          console.log(`PASS: ${required.size} required runtime secret names are bound.`);
          NODE
          rm -f /tmp/secret-list.json

      - name: Verify runtime dependencies from inside Cloudflare Worker
        shell: bash
        env:
          OPERATIONS_WORKER_SECRET: ${{ secrets.OPERATIONS_WORKER_SECRET }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $OPERATIONS_WORKER_SECRET" \
            "${{ steps.deploy.outputs.candidate_url }}/api/internal/runtime-health")"
          test "$status" = "204" || { echo "Runtime health gate failed with HTTP $status"; exit 1; }
          echo "PASS: Cloudflare runtime reached Supabase and Stripe using bound production credentials (read-only checks)."

      - name: Verify live Cloudflare response-security boundary
        run: node scripts/verify-cloudflare-live-response.mjs "${{ steps.deploy.outputs.candidate_url }}"

      - name: Confirm candidate remains isolated
        run: |
          echo "CANDIDATE_RUNTIME_GATE=PASS"
          echo "No certivoiq.com route, custom domain, DNS record, Supabase data, Stripe object, billing state, or Lovable resource was changed."
