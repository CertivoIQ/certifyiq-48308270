name: Patch runtime binding target to v12

on:
  push:
    paths:
      - '.github/workflows/patch-v12-runtime-binding-target.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point vetted runtime binding workflow at v12
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/cloudflare-v5-runtime-bindings.yml')
          s = p.read_text()
          s = s.replace('Bind production runtime secrets to v11 candidate', 'Bind production runtime secrets to v12 candidate')
          s = s.replace('certivoiq-launch-candidate-20260905-v11', 'certivoiq-launch-candidate-20260905-v12')
          s = s.replace('Confirm v11 candidate exists, production remains v10, and required secrets are present', 'Confirm v12 candidate exists, production remains v10, and required secrets are present')
          s = s.replace('Bind existing production runtime secrets to v11', 'Bind existing production runtime secrets to v12')
          s = s.replace('Verify exact secret names and authenticated v11 runtime health', 'Verify exact secret names and authenticated v12 runtime health')
          s = s.replace('V11_RUNTIME_SECRET_BIND=PASS', 'V12_RUNTIME_SECRET_BIND=PASS')
          s = s.replace('v11 runtime-health', 'v12 runtime-health')
          s = s.replace('V11_RUNTIME_AND_EDGE_GATE=PASS', 'V12_RUNTIME_AND_EDGE_GATE=PASS')
          p.write_text(s)
          PY
          git diff --check
          grep -F -q 'TARGET_WORKER: certivoiq-launch-candidate-20260905-v12' .github/workflows/cloudflare-v5-runtime-bindings.yml
          grep -F -q 'CURRENT_PRODUCTION_WORKER: certivoiq-launch-candidate-20260905-v10' .github/workflows/cloudflare-v5-runtime-bindings.yml
      - name: Commit binding target
        shell: bash
        run: |
          git config user.name 'CertivoIQ Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/cloudflare-v5-runtime-bindings.yml
          git commit -m 'Bind production runtime to v12 certification candidate'
          git push origin HEAD:main
