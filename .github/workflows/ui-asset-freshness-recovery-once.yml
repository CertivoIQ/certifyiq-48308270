name: UI asset freshness recovery once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-asset-freshness-recovery-once.yml'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_PAYMENTS_CLIENT_TOKEN: ${{ secrets.VITE_PAYMENTS_CLIENT_TOKEN }}
      OPERATIONS_WORKER_SECRET: ${{ secrets.OPERATIONS_WORKER_SECRET }}
      TARGET_WORKER: certivoiq-founder-dashboard-20260903
      TARGET_URL: https://certivoiq-founder-dashboard-20260903.rodsheka-watkins.workers.dev

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Require deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_PAYMENTS_CLIENT_TOKEN OPERATIONS_WORKER_SECRET; do
            test -n "${!name:-}" || { echo "$name is missing"; exit 1; }
          done

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify intended source before build
        shell: bash
        run: |
          set -euo pipefail
          grep -F -q 'const showProgress = true' src/components/portfolio-intake-panel.tsx
          grep -F -q 'Choose a certification to begin.' src/components/portfolio-intake-panel.tsx
          grep -F -q 'Upload single document' src/components/portfolio-intake-panel.tsx
          grep -F -q 'MAX_PARALLEL_OCR_WORKERS = 3' src/lib/pdf-ocr.ts
          grep -F -q 'aria-label="Platform dashboard"' src/components/app-shell.tsx
          grep -F -q 'Multifamily workspace' src/components/app-shell.tsx
          grep -F -q 'Cache-Control", "no-store, max-age=0"' src/server.ts
          bun run test:ocr

      - name: Build current frontend and Worker
        run: bun run build

      - name: Identify and verify local client assets
        shell: bash
        run: |
          set -euo pipefail
          intake_path="$(find .output/public/assets -maxdepth 1 -type f -name 'portfolio-intake-panel-*.js' | head -n 1)"
          shell_path="$(find .output/public/assets -maxdepth 1 -type f -name 'app-shell-*.js' | head -n 1)"
          test -n "$intake_path" && test -n "$shell_path"
          intake_asset="$(basename "$intake_path")"
          shell_asset="$(basename "$shell_path")"
          grep -F -q 'Choose a certification to begin.' "$intake_path"
          grep -F -q 'Upload single document' "$intake_path"
          grep -F -q 'Platform dashboard' "$shell_path"
          grep -F -q 'Multifamily workspace' "$shell_path"
          if grep -F -q 'filenames must match the CSV' "$intake_path"; then
            echo 'FAIL: stale intake copy is present in the new client asset.'
            exit 1
          fi
          echo "INTAKE_ASSET=$intake_asset" >> "$GITHUB_ENV"
          echo "APP_SHELL_ASSET=$shell_asset" >> "$GITHUB_ENV"
          echo "PASS: local frontend asset markers are current: $intake_asset / $shell_asset"

      - name: Confirm staging Worker exists and is not production
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" -o /tmp/workers.json
          jq -e --arg w "$TARGET_WORKER" 'any(.result[]; .id == $w)' /tmp/workers.json >/dev/null
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=certivoiq.com&account.id=$CLOUDFLARE_ACCOUNT_ID" -o /tmp/zones.json
          zone_id="$(jq -r 'if .success and (.result|length)==1 then .result[0].id else empty end' /tmp/zones.json)"
          test -n "$zone_id"
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/workers/routes" -o /tmp/routes.json
          if jq -e --arg w "$TARGET_WORKER" '.result[] | select((.pattern=="certivoiq.com/*" or .pattern=="www.certivoiq.com/*") and .script==$w)' /tmp/routes.json >/dev/null; then
            echo 'FAIL: staging Worker already owns a production route.'
            exit 1
          fi
          echo "ZONE_ID=$zone_id" >> "$GITHUB_ENV"

      - name: Prepare and deploy current build to isolated Worker
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-cloudflare-candidate-config.mjs .output/server/wrangler.json .output/server/wrangler.asset-freshness.json "$TARGET_WORKER"
          timeout 180s bunx --bun wrangler@4.129.0 deploy --config .output/server/wrangler.asset-freshness.json

      - name: Verify staged runtime, HTML freshness, and actual served client assets
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 12); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $OPERATIONS_WORKER_SECRET" "$TARGET_URL/api/internal/runtime-health")"
            if [ "$status" = 204 ]; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          node scripts/verify-cloudflare-live-response.mjs "$TARGET_URL"

          curl -fsS -H 'Cache-Control: no-cache' "$TARGET_URL/assets/$INTAKE_ASSET?release=$GITHUB_SHA" -o /tmp/staged-intake.js
          grep -F -q 'Choose a certification to begin.' /tmp/staged-intake.js
          grep -F -q 'Upload single document' /tmp/staged-intake.js
          ! grep -F -q 'filenames must match the CSV' /tmp/staged-intake.js

          curl -fsS -H 'Cache-Control: no-cache' "$TARGET_URL/assets/$APP_SHELL_ASSET?release=$GITHUB_SHA" -o /tmp/staged-shell.js
          grep -F -q 'Platform dashboard' /tmp/staged-shell.js
          grep -F -q 'Multifamily workspace' /tmp/staged-shell.js

          curl -sS -D /tmp/staged-html.headers -o /tmp/staged-html.body "$TARGET_URL/welcome?release=$GITHUB_SHA"
          grep -i -F -q 'cache-control: no-store, max-age=0' /tmp/staged-html.headers
          echo 'PASS: staged Worker is serving the new frontend assets and non-cacheable HTML.'

      - name: Switch production routes with asset-aware rollback
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" -o /tmp/routes-before.json
          apex_id="$(jq -r '.result[] | select(.pattern=="certivoiq.com/*") | .id' /tmp/routes-before.json)"
          www_id="$(jq -r '.result[] | select(.pattern=="www.certivoiq.com/*") | .id' /tmp/routes-before.json)"
          old_apex="$(jq -r '.result[] | select(.pattern=="certivoiq.com/*") | .script' /tmp/routes-before.json)"
          old_www="$(jq -r '.result[] | select(.pattern=="www.certivoiq.com/*") | .script' /tmp/routes-before.json)"
          test -n "$apex_id" && test -n "$www_id" && test -n "$old_apex" && test -n "$old_www"

          put_route() {
            local id="$1" pattern="$2" script="$3"
            curl -fsS -X PUT "${auth[@]}" -H 'Content-Type: application/json' \
              --data "$(jq -nc --arg p "$pattern" --arg s "$script" '{pattern:$p,script:$s}')" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes/$id" >/dev/null
          }

          put_route "$apex_id" 'certivoiq.com/*' "$TARGET_WORKER"
          put_route "$www_id" 'www.certivoiq.com/*' "$TARGET_WORKER"

          verify_production() {
            test "$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $OPERATIONS_WORKER_SECRET" https://certivoiq.com/api/internal/runtime-health)" = 204
            test "$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $OPERATIONS_WORKER_SECRET" https://www.certivoiq.com/api/internal/runtime-health)" = 204
            node scripts/verify-cloudflare-live-response.mjs https://certivoiq.com >/dev/null
            node scripts/verify-cloudflare-live-response.mjs https://www.certivoiq.com >/dev/null

            curl -fsS -H 'Cache-Control: no-cache' "https://certivoiq.com/assets/$INTAKE_ASSET?release=$GITHUB_SHA" -o /tmp/prod-intake.js
            grep -F -q 'Choose a certification to begin.' /tmp/prod-intake.js
            grep -F -q 'Upload single document' /tmp/prod-intake.js
            ! grep -F -q 'filenames must match the CSV' /tmp/prod-intake.js

            curl -fsS -H 'Cache-Control: no-cache' "https://certivoiq.com/assets/$APP_SHELL_ASSET?release=$GITHUB_SHA" -o /tmp/prod-shell.js
            grep -F -q 'Platform dashboard' /tmp/prod-shell.js
            grep -F -q 'Multifamily workspace' /tmp/prod-shell.js

            curl -sS -D /tmp/prod-html.headers -o /tmp/prod-html.body "https://certivoiq.com/welcome?release=$GITHUB_SHA"
            grep -i -F -q 'cache-control: no-store, max-age=0' /tmp/prod-html.headers
          }

          if ! verify_production; then
            echo 'Production verification failed; restoring previous route owners.'
            put_route "$apex_id" 'certivoiq.com/*' "$old_apex"
            put_route "$www_id" 'www.certivoiq.com/*' "$old_www"
            echo "ROLLBACK COMPLETE: apex->$old_apex www->$old_www"
            exit 1
          fi

          echo "PASS: production is serving current intake/app-shell assets via $TARGET_WORKER; rollback targets were apex=$old_apex www=$old_www"
