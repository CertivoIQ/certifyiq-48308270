name: Income Calculator and onboarding browser acceptance
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Native Income Calculator release]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: certivoiq-isolated-browser-acceptance
  cancel-in-progress: false
jobs:
  acceptance:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.3 }
      - name: Install exact application and isolated browser dependencies
        run: |
          bun install --frozen-lockfile
          npm install --prefix /tmp/certivoiq-browser --no-package-lock --ignore-scripts playwright@1.55.0
          node /tmp/certivoiq-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify authenticated test-account journeys on the exact public release
        env:
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          TEST_BASE_URL: https://certivoiq.com
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/test-income-onboarding-browser.mjs
      - name: Preserve sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: income-onboarding-browser-acceptance
          path: income-onboarding-acceptance/
          retention-days: 14
