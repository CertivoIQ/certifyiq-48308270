name: One-time exact limit source SHA capture
on:
  push:
    branches:
      - ops/capture-mtsp-2026-sha
    paths:
      - .github/workflows/one-time-state-limit-sha-capture.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Download and hash official exact files
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/limits
          failures=0
          capture() {
            local key="$1" url="$2" expected_magic="$3"
            local out="/tmp/limits/${key}"
            rm -f "$out"
            if ! curl --fail --location --retry 2 --retry-delay 2 --connect-timeout 30 --max-time 180 \
              -H 'Accept: application/pdf,application/octet-stream;q=0.9,*/*;q=0.8' \
              -H 'Accept-Language: en-US,en;q=0.9' \
              -H 'Referer: https://www.google.com/' \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152.0.0.0 Safari/537.36' \
              "$url" -o "$out"; then
              echo "CAPTURE_FAILED key=$key url=$url"
              failures=$((failures+1))
              return 0
            fi
            if [[ ! -s "$out" ]]; then
              echo "EMPTY_CAPTURE key=$key url=$url"
              failures=$((failures+1))
              return 0
            fi
            local magic sha bytes ctype
            magic="$(xxd -p -l 8 "$out" | tr -d '\n')"
            if [[ "$magic" != ${expected_magic}* ]]; then
              echo "MAGIC_MISMATCH key=$key expected=$expected_magic actual=$magic url=$url"
              failures=$((failures+1))
              return 0
            fi
            sha="$(sha256sum "$out" | awk '{print $1}')"
            bytes="$(stat -c %s "$out")"
            ctype="$(file --brief --mime-type "$out")"
            echo "CERTIVOIQ_EXACT_SOURCE key=$key sha256=$sha bytes=$bytes mime=$ctype magic=$magic url=$url"
          }
          capture HUD_FY2026_MTSP_PDF 'https://www.huduser.gov/portal/datasets/mtsp/mtsp26/HERA-Income-Limits-Report-FY26.pdf' '25504446'
          capture NH_2026_INCOME_LIMITS 'https://www.nhhousing.org/wp-content/uploads/2026/06/Income_Limits_2026.pdf' '25504446'
          capture NH_2026_RENT_LIMITS 'https://www.nhhousing.org/wp-content/uploads/2026/06/Rent_Limits_2026.pdf' '25504446'
          capture WI_2026_MTSP_LIMITS 'https://www.wheda.com/globalassets/documents/tax-credits/mf-data-library/2026-multifamily-tax-subsidy-project-mtsp-limits.pdf' '25504446'
          capture AZ_2026_2027_QAP 'https://housing.az.gov/sites/default/files/2026-08/2026-2027%20QAP-ADOH%20Clean%20Copy.pdf' '25504446'
          capture AZ_2025_LIHTC_COMPLIANCE_MANUAL 'https://housing.az.gov/sites/default/files/2025-08/LIHTC-Compliance-Manual_2025.pdf' '25504446'
          capture OR_2025_QAP 'https://www.oregon.gov/ohcs/rental-housing/housing-development/development-resources/Documents/QAP/2025-qap-final.pdf' '25504446'
          echo "CAPTURE_FAILURES=$failures"
          exit "$failures"
