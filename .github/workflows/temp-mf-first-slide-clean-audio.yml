name: Temporary Multifamily first-slide clean audio

on:
  push:
    branches:
      - temp/voice-audio-bridge-20260901
    paths:
      - .github/workflows/temp-mf-first-slide-clean-audio.yml

permissions:
  contents: read

jobs:
  fetch-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Download clean first-slide sentence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p clean-audio
          curl --fail --location --retry 3 --output clean-audio/mf-01-platform-post.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/57898c29-4ff7-49e9-98de-c9a8f04930f1.mp3'
          test -s clean-audio/mf-01-platform-post.mp3
          file clean-audio/mf-01-platform-post.mp3
      - name: Upload clean audio
        uses: actions/upload-artifact@v4
        with:
          name: mf-first-slide-clean-audio
          path: clean-audio/mf-01-platform-post.mp3
          if-no-files-found: error
          retention-days: 1
