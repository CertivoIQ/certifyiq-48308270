name: Operations Worker Dispatch

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certivoiq-operations-worker
  cancel-in-progress: false

jobs:
  tick:
    name: Run supervised operations tick
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate required secrets
        env:
          WORKER_SECRET: ${{ secrets.OPERATIONS_WORKER_SECRET }}
        run: |
          test -n "$WORKER_SECRET"

      - name: Run worker tick
        env:
          SUPABASE_URL: https://emnkzxkcpnyvglwxraxm.supabase.co
          WORKER_SECRET: ${{ secrets.OPERATIONS_WORKER_SECRET }}
        run: |
          curl --silent --show-error --fail-with-body \
            --request POST \
            --url "${SUPABASE_URL%/}/functions/v1/operations-worker" \
            --header "Authorization: Bearer $WORKER_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}'
