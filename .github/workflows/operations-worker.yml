name: Operations Worker Dispatch

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: certivoiq-operations-worker
  cancel-in-progress: false

jobs:
  tick:
    name: Run supervised operations tick
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run worker tick
        env:
          SUPABASE_URL: https://emnkzxkcpnyvglwxraxm.supabase.co
        run: |
          oidc_response="$(curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=certivoiq-operations-worker")"
          oidc_token="$(jq -er '.value' <<< "$oidc_response")"
          curl --silent --show-error --fail-with-body \
            --request POST \
            --url "${SUPABASE_URL%/}/functions/v1/operations-worker" \
            --header "Authorization: Bearer $oidc_token" \
            --header "Content-Type: application/json" \
            --data '{}'
