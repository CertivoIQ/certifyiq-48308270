name: UI asset freshness recovery v3 once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ui-asset-freshness-recovery-v3-once.yml']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_PAYMENTS_CLIENT_TOKEN: ${{ secrets.VITE_PAYMENTS_CLIENT_TOKEN }}
      OPERATIONS_WORKER_SECRET: ${{ secrets.OPERATIONS_WORKER_SECRET }}
      TARGET_WORKER: certivoiq-founder-dashboard-20260903
      TARGET_URL: https://certivoiq-founder-dashboard-20260903.rodsheka-watkins.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.3 }
      - name: Test source contracts
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          node --test scripts/test-cloudflare-candidate-config.mjs
          bun run test:ocr
          grep -F -q 'const showProgress = true' src/components/portfolio-intake-panel.tsx
          grep -F -q 'Choose a certification to begin.' src/components/portfolio-intake-panel.tsx
          grep -F -q 'Upload single document' src/components/portfolio-intake-panel.tsx
          grep -F -q 'MAX_PARALLEL_OCR_WORKERS = 3' src/lib/pdf-ocr.ts
          grep -F -q 'aria-label="Platform dashboard"' src/components/app-shell.tsx
          grep -F -q 'Multifamily workspace' src/components/app-shell.tsx
          grep -F -q 'assets.fetch(request)' src/server.ts
          grep -F -q 'pathname.startsWith("/assets/")' src/server.ts
          grep -F -q 'Cache-Control", "no-store, max-age=0"' src/server.ts
      - name: Build exact main
        run: bun run build
      - name: Capture current hashed client assets
        run: |
          set -euo pipefail
          intake="$(find .output/public/assets -maxdepth 1 -name 'portfolio-intake-panel-*.js' -type f | head -1)"
          shell="$(find .output/public/assets -maxdepth 1 -name 'app-shell-*.js' -type f | head -1)"
          test -n "$intake" && test -n "$shell"
          grep -F -q 'Choose a certification to begin.' "$intake"
          grep -F -q 'Upload single document' "$intake"
          ! grep -F -q 'filenames must match the CSV' "$intake"
          grep -F -q 'Platform dashboard' "$shell"
          grep -F -q 'Multifamily workspace' "$shell"
          echo "INTAKE_ASSET=$(basename "$intake")" >> "$GITHUB_ENV"
          echo "APP_SHELL_ASSET=$(basename "$shell")" >> "$GITHUB_ENV"
      - name: Confirm staging target is isolated
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" -o /tmp/w.json
          jq -e --arg w "$TARGET_WORKER" 'any(.result[]; .id==$w)' /tmp/w.json >/dev/null
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=certivoiq.com&account.id=$CLOUDFLARE_ACCOUNT_ID" -o /tmp/z.json
          zid="$(jq -r 'if .success and (.result|length)==1 then .result[0].id else empty end' /tmp/z.json)"
          test -n "$zid"
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zid/workers/routes" -o /tmp/r.json
          ! jq -e --arg w "$TARGET_WORKER" '.result[]|select((.pattern=="certivoiq.com/*" or .pattern=="www.certivoiq.com/*") and .script==$w)' /tmp/r.json >/dev/null
          echo "ZONE_ID=$zid" >> "$GITHUB_ENV"
      - name: Deploy isolated Worker with explicit ASSETS dispatch
        run: |
          set -euo pipefail
          node scripts/prepare-cloudflare-candidate-config.mjs .output/server/wrangler.json .output/server/wrangler.asset-v3.json "$TARGET_WORKER"
          jq -e '.assets.run_worker_first == true and .assets.binding == "ASSETS"' .output/server/wrangler.asset-v3.json >/dev/null
          timeout 180s bunx --bun wrangler@4.129.0 deploy --config .output/server/wrangler.asset-v3.json
      - name: Prove staged browser files are served
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 12); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $OPERATIONS_WORKER_SECRET" "$TARGET_URL/api/internal/runtime-health")"
            [ "$code" = 204 ] && { ok=1; break; }
            sleep 5
          done
          [ "$ok" = 1 ]
          node scripts/verify-cloudflare-live-response.mjs "$TARGET_URL"
          curl -fsS -D /tmp/ih -H 'Cache-Control: no-cache' "$TARGET_URL/assets/$INTAKE_ASSET?release=$GITHUB_SHA" -o /tmp/i.js
          grep -i -E -q '^content-type:.*(javascript|text/plain)' /tmp/ih
          grep -F -q 'Choose a certification to begin.' /tmp/i.js
          grep -F -q 'Upload single document' /tmp/i.js
          ! grep -F -q 'filenames must match the CSV' /tmp/i.js
          curl -fsS -H 'Cache-Control: no-cache' "$TARGET_URL/assets/$APP_SHELL_ASSET?release=$GITHUB_SHA" -o /tmp/s.js
          grep -F -q 'Platform dashboard' /tmp/s.js
          grep -F -q 'Multifamily workspace' /tmp/s.js
          curl -sS -D /tmp/htmlh -o /dev/null "$TARGET_URL/welcome?release=$GITHUB_SHA"
          grep -i -F -q 'cache-control: no-store, max-age=0' /tmp/htmlh
          echo 'STAGED_BROWSER_ASSET_GATE=PASS'
      - name: Cut over only after browser asset proof and roll back on any failure
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" -o /tmp/r.json
          aid="$(jq -r '.result[]|select(.pattern=="certivoiq.com/*")|.id' /tmp/r.json)"
          wid="$(jq -r '.result[]|select(.pattern=="www.certivoiq.com/*")|.id' /tmp/r.json)"
          olda="$(jq -r '.result[]|select(.pattern=="certivoiq.com/*")|.script' /tmp/r.json)"
          oldw="$(jq -r '.result[]|select(.pattern=="www.certivoiq.com/*")|.script' /tmp/r.json)"
          put(){ curl -fsS -X PUT "${auth[@]}" -H 'Content-Type: application/json' --data "$(jq -nc --arg p "$2" --arg s "$3" '{pattern:$p,script:$s}')" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes/$1" >/dev/null; }
          put "$aid" 'certivoiq.com/*' "$TARGET_WORKER"
          put "$wid" 'www.certivoiq.com/*' "$TARGET_WORKER"
          verify(){
            [ "$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $OPERATIONS_WORKER_SECRET" https://certivoiq.com/api/internal/runtime-health)" = 204 ] &&
            [ "$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $OPERATIONS_WORKER_SECRET" https://www.certivoiq.com/api/internal/runtime-health)" = 204 ] &&
            node scripts/verify-cloudflare-live-response.mjs https://certivoiq.com >/dev/null &&
            node scripts/verify-cloudflare-live-response.mjs https://www.certivoiq.com >/dev/null &&
            curl -fsS -H 'Cache-Control: no-cache' "https://certivoiq.com/assets/$INTAKE_ASSET?release=$GITHUB_SHA" -o /tmp/pi.js &&
            grep -F -q 'Choose a certification to begin.' /tmp/pi.js &&
            grep -F -q 'Upload single document' /tmp/pi.js &&
            ! grep -F -q 'filenames must match the CSV' /tmp/pi.js &&
            curl -fsS -H 'Cache-Control: no-cache' "https://certivoiq.com/assets/$APP_SHELL_ASSET?release=$GITHUB_SHA" -o /tmp/ps.js &&
            grep -F -q 'Platform dashboard' /tmp/ps.js &&
            grep -F -q 'Multifamily workspace' /tmp/ps.js &&
            curl -sS -D /tmp/ph -o /dev/null "https://certivoiq.com/welcome?release=$GITHUB_SHA" &&
            grep -i -F -q 'cache-control: no-store, max-age=0' /tmp/ph
          }
          if ! verify; then
            put "$aid" 'certivoiq.com/*' "$olda"
            put "$wid" 'www.certivoiq.com/*' "$oldw"
            echo "ROLLBACK COMPLETE: apex=$olda www=$oldw"
            exit 1
          fi
          echo "PRODUCTION_BROWSER_ASSET_GATE=PASS worker=$TARGET_WORKER rollback_apex=$olda rollback_www=$oldw"
