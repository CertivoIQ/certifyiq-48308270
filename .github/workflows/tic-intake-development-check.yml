name: TIC intake development check
on:
  push:
    branches: [fix/tic-field-mirroring-20260905]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tic-cell-recognition-20260905
          persist-credentials: false
      - name: Package source for isolated verification
        run: |
          git rev-parse HEAD > /tmp/tic-candidate-sha.txt
          git archive --format=tar HEAD > /tmp/tic-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: tic-candidate-source
          path: |
            /tmp/tic-source.tar
            /tmp/tic-candidate-sha.txt
          retention-days: 1
