name: Pilot State Source Evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - config/pilot-state-sources.json
      - scripts/capture-pilot-state-evidence.mjs
      - scripts/test-pilot-state-evidence-pipeline.mjs
      - .github/workflows/pilot-state-source-evidence.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate fail-closed evidence pipeline
        run: node --test scripts/test-pilot-state-evidence-pipeline.mjs
      - name: Capture exact official-source bytes
        run: node scripts/capture-pilot-state-evidence.mjs
      - name: Upload controlled-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-state-source-evidence
          path: artifacts/pilot-state-source-evidence.json
          if-no-files-found: error
          retention-days: 30
