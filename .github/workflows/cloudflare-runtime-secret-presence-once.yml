name: Cloudflare runtime secret presence once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-runtime-secret-presence-once.yml"

permissions:
  contents: read

jobs:
  presence:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      STRIPE_LIVE_API_KEY: ${{ secrets.STRIPE_LIVE_API_KEY }}
      VITE_PAYMENTS_CLIENT_TOKEN: ${{ secrets.VITE_PAYMENTS_CLIENT_TOKEN }}
      PAYMENTS_LIVE_WEBHOOK_SECRET: ${{ secrets.PAYMENTS_LIVE_WEBHOOK_SECRET }}
      STRIPE_MULTIFAMILY_ENTERPRISE_PRICE_ID_LIVE: ${{ secrets.STRIPE_MULTIFAMILY_ENTERPRISE_PRICE_ID_LIVE }}
      STRIPE_PHA_PRICE_ID_LIVE: ${{ secrets.STRIPE_PHA_PRICE_ID_LIVE }}
      STRIPE_BILLING_PORTAL_CONFIGURATION_ID_LIVE: ${{ secrets.STRIPE_BILLING_PORTAL_CONFIGURATION_ID_LIVE }}
      PAYMENTS_LIVE_VERIFIED: ${{ secrets.PAYMENTS_LIVE_VERIFIED }}
      OPERATIONS_WORKER_SECRET: ${{ secrets.OPERATIONS_WORKER_SECRET }}
      SUPPORT_EMAIL_WEBHOOK_SECRET: ${{ secrets.SUPPORT_EMAIL_WEBHOOK_SECRET }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          required=(
            SUPABASE_URL
            SUPABASE_SERVICE_ROLE_KEY
            VITE_SUPABASE_URL
            VITE_SUPABASE_PUBLISHABLE_KEY
            STRIPE_LIVE_API_KEY
            VITE_PAYMENTS_CLIENT_TOKEN
            PAYMENTS_LIVE_WEBHOOK_SECRET
            STRIPE_MULTIFAMILY_ENTERPRISE_PRICE_ID_LIVE
            STRIPE_PHA_PRICE_ID_LIVE
          )
          optional=(
            STRIPE_BILLING_PORTAL_CONFIGURATION_ID_LIVE
            PAYMENTS_LIVE_VERIFIED
            OPERATIONS_WORKER_SECRET
            SUPPORT_EMAIL_WEBHOOK_SECRET
          )
          missing=0
          echo "=== REQUIRED RUNTIME SOURCES ==="
          for name in "${required[@]}"; do
            if [ -n "${!name:-}" ]; then echo "$name=PRESENT"; else echo "$name=MISSING"; missing=1; fi
          done
          echo "=== OPTIONAL / FEATURE-SPECIFIC SOURCES ==="
          for name in "${optional[@]}"; do
            if [ -n "${!name:-}" ]; then echo "$name=PRESENT"; else echo "$name=MISSING"; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "CUTOVER_RUNTIME_SECRET_GATE=BLOCKED"
            exit 1
          fi
          echo "CUTOVER_RUNTIME_SECRET_GATE=PASS"
