name: Cloudflare production read-only diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: "Approved 40-character Git release SHA (defaults to this commit)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ZONE_NAME: certivoiq.com
      EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify Cloudflare zone, DNS, TLS, domains, and release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          current_check="Validating required diagnostic inputs"
          trap 'echo "::error title=Cloudflare diagnostic failed::$current_check" >&2' ERR
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]

          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          cf_get() {
            local url="$1"
            local destination="$2"
            curl --fail-with-body --silent --show-error "${auth[@]}" "$url" -o "$destination"
            jq -e '.success == true' "$destination" >/dev/null
          }

          current_check="Looking up certivoiq.com in the configured Cloudflare account"
          cf_get "$api/zones?name=$ZONE_NAME&account.id=$CLOUDFLARE_ACCOUNT_ID" /tmp/zones.json
          zone_count="$(jq '.result | length' /tmp/zones.json)"
          [ "$zone_count" -eq 1 ]
          zone_id="$(jq -r '.result[0].id' /tmp/zones.json)"
          zone_status="$(jq -r '.result[0].status' /tmp/zones.json)"
          [ "$zone_status" = "active" ]

          current_check="Verifying proxied apex and www web DNS records"
          cf_get "$api/zones/$zone_id/dns_records?name=$ZONE_NAME" /tmp/dns-apex.json
          cf_get "$api/zones/$zone_id/dns_records?name=www.$ZONE_NAME" /tmp/dns-www.json
          jq -e '.result | map(select((.type == "A" or .type == "AAAA" or .type == "CNAME") and .proxied == true)) | length >= 1' /tmp/dns-apex.json >/dev/null
          jq -e '.result | map(select((.type == "A" or .type == "AAAA" or .type == "CNAME") and .proxied == true)) | length >= 1' /tmp/dns-www.json >/dev/null

          current_check="Verifying SSL mode"
          cf_get "$api/zones/$zone_id/settings/ssl" /tmp/ssl.json
          ssl_mode="$(jq -r '.result.value' /tmp/ssl.json)"
          [[ "$ssl_mode" = "full" || "$ssl_mode" = "strict" ]]

          current_check="Verifying minimum TLS version"
          cf_get "$api/zones/$zone_id/settings/min_tls_version" /tmp/min-tls.json
          min_tls="$(jq -r '.result.value' /tmp/min-tls.json)"
          [[ "$min_tls" = "1.2" || "$min_tls" = "1.3" ]]

          current_check="Verifying Always Use HTTPS"
          cf_get "$api/zones/$zone_id/settings/always_use_https" /tmp/https.json
          [ "$(jq -r '.result.value' /tmp/https.json)" = "on" ]

          current_check="Verifying Worker custom domains"
          cf_get "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" /tmp/domains.json
          apex_service="$(jq -r --arg host "$ZONE_NAME" '.result[] | select(.hostname == $host) | .service' /tmp/domains.json)"
          www_service="$(jq -r --arg host "www.$ZONE_NAME" '.result[] | select(.hostname == $host) | .service' /tmp/domains.json)"
          test -n "$apex_service"
          [ "$apex_service" = "$www_service" ]

          current_check="Reading Worker routes"
          cf_get "$api/zones/$zone_id/workers/routes" /tmp/routes.json

          current_check="Verifying apex and www HTTP responses"
          apex_http="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "https://$ZONE_NAME/")"
          www_http="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "https://www.$ZONE_NAME/")"
          [ "$apex_http" = "200" ]
          [ "$www_http" = "200" ]

          current_check="Verifying live production release SHA"
          live_sha=""
          for attempt in $(seq 1 30); do
            curl --fail-with-body --silent --show-error --location "https://$ZONE_NAME/api/public/health" -o /tmp/health.json
            live_sha="$(jq -r '.releaseSha // empty' /tmp/health.json)"
            if [ "$live_sha" = "${EXPECTED_RELEASE_SHA,,}" ]; then
              break
            fi
            sleep 20
          done
          [ "$live_sha" = "${EXPECTED_RELEASE_SHA,,}" ]

          {
            echo "## Cloudflare production diagnostic"
            echo "- Zone: $ZONE_NAME ($zone_status)"
            echo "- Worker service: $apex_service"
            echo "- TLS mode: $ssl_mode"
            echo "- Minimum TLS: $min_tls"
            echo "- Apex/WWW HTTP: $apex_http/$www_http"
            echo "- Release SHA: $live_sha"
            echo "- Mutation performed: no"
          } >> "$GITHUB_STEP_SUMMARY"
