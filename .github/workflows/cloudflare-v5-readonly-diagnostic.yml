name: Cloudflare v5 read-only diagnostic

on:
  push:
    paths:
      - '.github/workflows/cloudflare-v5-readonly-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPERATIONS_WORKER_SECRET: ${{ secrets.OPERATIONS_WORKER_SECRET }}
      SOURCE_WORKER: certivoiq-launch-candidate-20260904-v3
      TARGET_WORKER: certivoiq-launch-candidate-20260904-v5
      SOURCE_URL: https://certivoiq-launch-candidate-20260904-v3.rodsheka-watkins.workers.dev
      TARGET_URL: https://certivoiq-launch-candidate-20260904-v5.rodsheka-watkins.workers.dev
      STATED_V5_VERSION: d6f882ea-b31f-4c02-9321-928226bdbada
      ZONE_NAME: certivoiq.com
    steps:
      - uses: actions/checkout@v4

      - name: Read-only version and runtime diagnostics
        shell: bash
        run: |
          set -u
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          api='https://api.cloudflare.com/client/v4'

          inspect_worker() {
            local worker="$1"
            local safe="$(echo "$worker" | tr '[:lower:]-' '[:upper:]_')"
            local deployments="/tmp/${worker}-deployments.json"
            local code
            code="$(curl -sS -o "$deployments" -w '%{http_code}' "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker/deployments")"
            echo "${safe}_DEPLOYMENTS_HTTP=$code"
            [ "$code" = 200 ] || return 0

            jq -r '.result.deployments[]? | "DEPLOYMENT id=\(.id) created=\(.created_on) versions=" + ([.versions[]? | "\(.version_id)@\(.percentage)%"] | join(","))' "$deployments" | while IFS= read -r line; do
              echo "${safe}_${line}"
            done

            jq -r '.result.deployments[]?.versions[]?.version_id' "$deployments" | sort -u | while IFS= read -r vid; do
              [ -n "$vid" ] || continue
              local vf="/tmp/${worker}-${vid}.json"
              local vc
              vc="$(curl -sS -o "$vf" -w '%{http_code}' "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker/versions/$vid")"
              echo "${safe}_VERSION_${vid}_HTTP=$vc"
              if [ "$vc" = 200 ]; then
                echo "${safe}_VERSION_${vid}_BINDINGS=$(jq -r '[.result.resources.bindings[]? | (.type // "unknown") + ":" + (.name // "unnamed")] | sort | join(",")' "$vf")"
              fi
            done
          }

          inspect_worker "$SOURCE_WORKER"
          inspect_worker "$TARGET_WORKER"

          stated_file=/tmp/stated-v5.json
          stated_code="$(curl -sS -o "$stated_file" -w '%{http_code}' "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/versions/$STATED_V5_VERSION")"
          echo "STATED_V5_VERSION_HTTP=$stated_code"
          if [ "$stated_code" = 200 ]; then
            echo "STATED_V5_VERSION_BINDINGS=$(jq -r '[.result.resources.bindings[]? | (.type // "unknown") + ":" + (.name // "unnamed")] | sort | join(",")' "$stated_file")"
          fi

          source_health="$(curl -sS -o /tmp/source-health.out -w '%{http_code}' -H "Authorization: Bearer $OPERATIONS_WORKER_SECRET" "$SOURCE_URL/api/internal/runtime-health")"
          target_health="$(curl -sS -o /tmp/target-health.out -w '%{http_code}' -H "Authorization: Bearer $OPERATIONS_WORKER_SECRET" "$TARGET_URL/api/internal/runtime-health")"
          www_health="$(curl -sS -o /tmp/www-health.out -w '%{http_code}' -H "Authorization: Bearer $OPERATIONS_WORKER_SECRET" 'https://www.certivoiq.com/api/internal/runtime-health')"
          apex_health="$(curl -sS -o /tmp/apex-health.out -w '%{http_code}' -H "Authorization: Bearer $OPERATIONS_WORKER_SECRET" 'https://certivoiq.com/api/internal/runtime-health')"
          echo "V3_WORKERS_DEV_HEALTH_AUTH_HTTP=$source_health"
          echo "V5_WORKERS_DEV_HEALTH_AUTH_HTTP=$target_health"
          echo "WWW_HEALTH_AUTH_HTTP=$www_health"
          echo "APEX_HEALTH_AUTH_HTTP=$apex_health"

          curl -fsS "${auth[@]}" "$api/zones?name=$ZONE_NAME&account.id=$CLOUDFLARE_ACCOUNT_ID" -o /tmp/zones.json || true
          zid="$(jq -r 'if .success and (.result|length)==1 then .result[0].id else empty end' /tmp/zones.json 2>/dev/null || true)"
          if [ -n "$zid" ]; then
            curl -fsS "${auth[@]}" "$api/zones/$zid/workers/routes" -o /tmp/routes.json || true
            echo "ROUTES_COUNT=$(jq -r '.result|length' /tmp/routes.json 2>/dev/null || echo unknown)"
            curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" -o /tmp/domains.json || true
            echo "WWW_SERVICE=$(jq -r '.result[]?|select(.hostname=="www.certivoiq.com")|.service' /tmp/domains.json 2>/dev/null || true)"
            echo "APEX_SERVICE=$(jq -r '.result[]?|select(.hostname=="certivoiq.com")|.service' /tmp/domains.json 2>/dev/null || true)"
          fi

          echo 'READ_ONLY_VERSION_DIAGNOSTIC_COMPLETE'
          echo 'REFRESH_MARKER=20260905-onboarding-separation-check'
