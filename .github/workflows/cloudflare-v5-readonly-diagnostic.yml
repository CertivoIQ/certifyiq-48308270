name: Cloudflare certification release read-only diagnostic

on:
  push:
    paths:
      - '.github/workflows/cloudflare-v5-readonly-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPERATIONS_WORKER_SECRET: ${{ secrets.OPERATIONS_WORKER_SECRET }}
      V10_URL: https://certivoiq-launch-candidate-20260905-v10.rodsheka-watkins.workers.dev
      V11_URL: https://certivoiq-launch-candidate-20260905-v11.rodsheka-watkins.workers.dev
      V12_URL: https://certivoiq-launch-candidate-20260905-v12.rodsheka-watkins.workers.dev
      ZONE_NAME: certivoiq.com
    steps:
      - uses: actions/checkout@v4

      - name: Read-only current custom-domain and runtime diagnostic
        shell: bash
        run: |
          set -u
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          api='https://api.cloudflare.com/client/v4'

          v10_health="$(curl -sS -o /tmp/v10-health.out -w '%{http_code}' -H "Authorization: Bearer $OPERATIONS_WORKER_SECRET" "$V10_URL/api/internal/runtime-health" || true)"
          v11_health="$(curl -sS -o /tmp/v11-health.out -w '%{http_code}' -H "Authorization: Bearer $OPERATIONS_WORKER_SECRET" "$V11_URL/api/internal/runtime-health" || true)"
          v12_health="$(curl -sS -o /tmp/v12-health.out -w '%{http_code}' -H "Authorization: Bearer $OPERATIONS_WORKER_SECRET" "$V12_URL/api/internal/runtime-health" || true)"
          www_health="$(curl -sS -o /tmp/www-health.out -w '%{http_code}' -H "Authorization: Bearer $OPERATIONS_WORKER_SECRET" 'https://www.certivoiq.com/api/internal/runtime-health' || true)"
          apex_health="$(curl -sS -o /tmp/apex-health.out -w '%{http_code}' -H "Authorization: Bearer $OPERATIONS_WORKER_SECRET" 'https://certivoiq.com/api/internal/runtime-health' || true)"
          echo "V10_WORKERS_DEV_HEALTH_AUTH_HTTP=$v10_health"
          echo "V11_WORKERS_DEV_HEALTH_AUTH_HTTP=$v11_health"
          echo "V12_WORKERS_DEV_HEALTH_AUTH_HTTP=$v12_health"
          echo "WWW_HEALTH_AUTH_HTTP=$www_health"
          echo "APEX_HEALTH_AUTH_HTTP=$apex_health"

          curl -fsS "${auth[@]}" "$api/zones?name=$ZONE_NAME&account.id=$CLOUDFLARE_ACCOUNT_ID" -o /tmp/zones.json || true
          zid="$(jq -r 'if .success and (.result|length)==1 then .result[0].id else empty end' /tmp/zones.json 2>/dev/null || true)"
          if [ -n "$zid" ]; then
            curl -fsS "${auth[@]}" "$api/zones/$zid/workers/routes" -o /tmp/routes.json || true
            echo "ROUTES_COUNT=$(jq -r '.result|length' /tmp/routes.json 2>/dev/null || echo unknown)"
            curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" -o /tmp/domains.json || true
            echo "WWW_SERVICE=$(jq -r '.result[]?|select(.hostname=="www.certivoiq.com")|.service' /tmp/domains.json 2>/dev/null || true)"
            echo "APEX_SERVICE=$(jq -r '.result[]?|select(.hostname=="certivoiq.com")|.service' /tmp/domains.json 2>/dev/null || true)"
          fi

          echo 'READ_ONLY_POST_CUTOVER_CERTIFICATION_RELEASE_DIAGNOSTIC_COMPLETE'
