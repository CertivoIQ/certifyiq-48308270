name: Normalize FREE review marketing

on:
  push:
    paths:
      - '.github/workflows/normalize-free-review-marketing.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace legacy trial marketing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          extensions = {'.ts', '.tsx', '.md', '.mdx', '.json', '.html', '.txt', '.yml', '.yaml'}
          replacements = [
              ('Start 7-day trial', 'Start with 3 FREE certification reviews'),
              ('start 7-day trial', 'start with 3 FREE certification reviews'),
              ('7-day free trial', '3 FREE certification reviews'),
              ('7-day trial', '3 FREE certification reviews'),
              ('7 day free trial', '3 FREE certification reviews'),
              ('7 day trial', '3 FREE certification reviews'),
              ('Review 3 files free', 'Review 3 files FREE'),
              ('Run 3 free certification reviews', 'Run 3 FREE certification reviews'),
              ('Run 3 free reviews', 'Run 3 FREE reviews'),
              ('Run free reviews', 'Run FREE reviews'),
              ('three free certification reviews', 'three FREE certification reviews'),
              ('three free reviews', 'three FREE reviews'),
              ('3 free certification reviews', '3 FREE certification reviews'),
              ('3 free reviews', '3 FREE reviews'),
              ('3 Free Certification Reviews', '3 FREE Certification Reviews'),
              ('3 Free certification reviews', '3 FREE certification reviews'),
              ('free certification reviews', 'FREE certification reviews'),
          ]

          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix not in extensions:
                  continue
              if '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          print('\n'.join(changed) if changed else '(none)')
          PY

      - name: Verify no legacy trial marketing remains
        shell: bash
        run: |
          if git grep -n -I -E '7-day trial|7 day trial|7-day free trial|7 day free trial|Start 7-day trial' -- ':!*.lock'; then
            echo 'Legacy 7-day trial marketing remains.'
            exit 1
          fi

      - name: Commit normalized marketing
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No marketing changes needed.'
            exit 0
          fi
          git commit -m 'chore: replace trial marketing with FREE review offer'
          git push

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git rm -f .github/workflows/normalize-free-review-marketing.yml || true
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: remove temporary marketing normalization workflow'
            git push
          fi
