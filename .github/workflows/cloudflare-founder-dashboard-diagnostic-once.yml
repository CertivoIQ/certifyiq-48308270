name: Cloudflare founder dashboard diagnostic once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-founder-dashboard-diagnostic-once.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPERATIONS_WORKER_SECRET: ${{ secrets.OPERATIONS_WORKER_SECRET }}
      TARGET_WORKER: certivoiq-founder-dashboard-20260903
      TARGET_URL: https://certivoiq-founder-dashboard-20260903.rodsheka-watkins.workers.dev

    steps:
      - name: Require diagnostic credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID OPERATIONS_WORKER_SECRET; do
            test -n "${!name:-}" || { echo "$name is missing"; exit 1; }
          done

      - name: Verify staged secret names only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 secret list --name "$TARGET_WORKER" --format json > /tmp/secrets.json
          node <<'NODE'
          const rows = require('/tmp/secrets.json');
          const present = new Set(rows.map((row) => row.name));
          const required = [
            'SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY','VITE_SUPABASE_URL','VITE_SUPABASE_PUBLISHABLE_KEY',
            'STRIPE_LIVE_API_KEY','VITE_PAYMENTS_CLIENT_TOKEN','PAYMENTS_LIVE_WEBHOOK_SECRET',
            'STRIPE_MULTIFAMILY_ENTERPRISE_PRICE_ID_LIVE','STRIPE_PHA_PRICE_ID_LIVE','OPERATIONS_WORKER_SECRET'
          ];
          const missing = required.filter((name) => !present.has(name));
          if (missing.length) throw new Error(`Missing staged secret names: ${missing.join(', ')}`);
          console.log(`PASS: ${required.length} staged runtime secret names are present.`);
          NODE
          rm -f /tmp/secrets.json

      - name: Probe staged runtime after propagation window
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              -H "Authorization: Bearer $OPERATIONS_WORKER_SECRET" \
              "$TARGET_URL/api/internal/runtime-health")"
            echo "Attempt $attempt: HTTP $status"
            if [ "$status" = "204" ]; then
              echo "STAGED_RUNTIME_PROPAGATION_GATE=PASS"
              exit 0
            fi
            sleep 5
          done
          echo "STAGED_RUNTIME_PROPAGATION_GATE=FAIL"
          exit 1

      - name: Confirm production routes unchanged
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=certivoiq.com&account.id=$CLOUDFLARE_ACCOUNT_ID" \
            -o /tmp/zones.json
          zone_id="$(node -e 'const d=require("/tmp/zones.json"); if(!d.success||d.result.length!==1) process.exit(1); process.stdout.write(d.result[0].id)')"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/workers/routes" \
            -o /tmp/routes.json
          TARGET_WORKER="$TARGET_WORKER" node <<'NODE'
          const d = require('/tmp/routes.json');
          if (!d.success) process.exit(1);
          for (const pattern of ['certivoiq.com/*','www.certivoiq.com/*']) {
            const matches = d.result.filter((r) => r.pattern === pattern);
            if (matches.length !== 1) throw new Error(`Expected exactly one route for ${pattern}`);
            console.log(`${pattern} -> ${matches[0].script}`);
            if (matches[0].script === process.env.TARGET_WORKER) {
              throw new Error(`${pattern} unexpectedly points to staged Worker`);
            }
          }
          console.log('PASS: production routes were not changed by the failed staging release.');
          NODE
          rm -f /tmp/zones.json /tmp/routes.json
