name: Nationwide State Validation Document Families
on:
  pull_request:
    branches: [main]
    paths:
      - src/lib/nationwide-state-source-discovery.json
      - src/lib/nationwide-state-source-evidence-pipeline.mjs
      - src/lib/state-validation-document-families.mjs
      - scripts/crawl-state-validation-document-families.mjs
      - scripts/crawl-tn-tx-release-critical-documents.mjs
      - scripts/test-state-validation-document-families.mjs
      - scripts/test-tn-tx-document-level-validation.mjs
      - supabase/migrations/20260903190000_invalidate_tn_tx_html_page_evidence.sql
      - .github/workflows/state-validation-document-families.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: state-validation-document-families-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      PDFJS_DIST_PATH: /tmp/state-capture/node_modules/pdfjs-dist/legacy/build/pdf.mjs
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned PDF parser without changing the lockfile
        run: npm install --prefix /tmp/state-capture --no-save --package-lock=false --ignore-scripts pdfjs-dist@6.2.108
      - name: Validate document-family controls
        run: node --test scripts/test-state-validation-document-families.mjs scripts/test-tn-tx-document-level-validation.mjs scripts/test-nationwide-state-source-evidence-pipeline.mjs
      - name: Crawl and hash TN/TX release-critical documents
        run: node scripts/crawl-tn-tx-release-critical-documents.mjs
      - name: Upload TN/TX release-critical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tn-tx-release-critical-documents
          path: artifacts/tn-tx-release-critical-documents.json
          if-no-files-found: error
          retention-days: 30
      - name: Crawl and hash current official documents
        run: node scripts/crawl-state-validation-document-families.mjs
      - name: Upload nationwide validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-validation-document-families
          path: artifacts/state-validation-document-families.json
          if-no-files-found: error
          retention-days: 30
