name: HUD Source Watch

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/hud-source-watch.yml'
      - 'scripts/stage-hud-source-snapshot.mjs'
      - 'scripts/test-hud-source-pipeline.mjs'
      - 'src/lib/hud-source-pipeline.mjs'
      - 'supabase/migrations/20260918164500_restore_hud_source_staging_rpc.sql'
      - 'supabase/migrations/20260918171500_harden_hud_source_staging_boundary.sql'
      - 'supabase/functions/operations-worker/index.ts'
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: certivoiq-hud-source-watch
  cancel-in-progress: false

jobs:
  stage:
    name: Retrieve, validate, and stage HUD source evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate required configuration
        env:
          CERTIVOIQ_SUPABASE_URL: ${{ secrets.CERTIVOIQ_SUPABASE_URL }}
        run: test -n "$CERTIVOIQ_SUPABASE_URL"
      - name: Verify HUD source pipeline controls
        run: node --test scripts/test-hud-source-pipeline.mjs
      - name: Stage HUD schedule evidence
        env:
          CERTIVOIQ_SUPABASE_URL: ${{ secrets.CERTIVOIQ_SUPABASE_URL }}
        run: node scripts/stage-hud-source-snapshot.mjs
