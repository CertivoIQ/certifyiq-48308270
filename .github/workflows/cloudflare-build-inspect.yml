name: Cloudflare candidate build inspection

on:
  pull_request:
    paths:
      - ".github/workflows/cloudflare-build-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build current candidate
        run: bun run build

      - name: Inspect generated Cloudflare deployment contract
        shell: bash
        run: |
          set -euo pipefail
          echo "=== generated wrangler redirect ==="
          if [ -f .wrangler/deploy/config.json ]; then
            cat .wrangler/deploy/config.json
          else
            echo "MISSING: .wrangler/deploy/config.json"
          fi

          echo "=== generated Wrangler configs ==="
          mapfile -t configs < <(find . -path './node_modules' -prune -o -name 'wrangler.json' -type f -print | sort)
          if [ ${#configs[@]} -eq 0 ]; then
            echo "MISSING: no generated wrangler.json"
            exit 1
          fi
          for config in "${configs[@]}"; do
            echo "--- $config ---"
            cat "$config"
          done

          echo "=== output layout ==="
          find .output dist -maxdepth 3 -type f -print 2>/dev/null | sort | head -250 || true

          echo "=== launch headers in generated output ==="
          mapfile -t headers < <(find .output dist -name '_headers' -type f -print 2>/dev/null | sort)
          if [ ${#headers[@]} -eq 0 ]; then
            echo "MISSING: generated _headers"
            exit 1
          fi
          for header_file in "${headers[@]}"; do
            echo "--- $header_file ---"
            cat "$header_file"
          done
