name: Validate onboarding and authenticated calculator repair
on:
  push:
    branches: [fix/onboarding-calculator-acceptance]
    paths:
      - '.github/workflows/install-onboarding-repair.yml'
      - 'scripts/install-onboarding-repair.mjs'
      - 'scripts/verify-income-onboarding-session.mjs'
permissions:
  contents: write
concurrency:
  group: certivoiq-onboarding-repair-acceptance
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/onboarding-calculator-acceptance
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.4.5
      - name: Install verified candidate source only when missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: test -f src/lib/onboarding-client.ts || node scripts/install-onboarding-repair.mjs
      - name: Preserve candidate repair on isolated branch
        run: |
          git config user.name 'CertivoIQ Release Bot'
          git config user.email 'release-bot@certivoiq.com'
          git add src scripts/test-command-center-certification-actions.mjs scripts/test-onboarding-repair.mjs scripts/verify-income-onboarding-session.mjs docs/native-income-calculator.md .github/workflows/native-income-calculator-release.yml package.json
          if ! git diff --cached --quiet; then
            git commit -m 'Repair Step 2 handoff, align schema contracts and resolve strict platform diagnostics'
            git push origin HEAD:fix/onboarding-calculator-acceptance
          fi
          echo "ACCEPTANCE_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Full strict typecheck and regression tests
        run: |
          set -euo pipefail
          node_modules/.bin/tsc --noEmit --pretty false
          node --test scripts/test-native-income-calculator.mjs scripts/test-onboarding-repair.mjs scripts/test-tic-spatial-extraction.mjs scripts/test-tic-native-form-extraction.mjs scripts/test-command-center-certification-actions.mjs scripts/test-standalone-supporting-document-upload.mjs scripts/test-controlled-mass-portfolio-intake.mjs scripts/test-onboarding-certification-separation.mjs scripts/test-certification-task-workflow.mjs scripts/test-enterprise-billing-terminal-controls.mjs scripts/test-enterprise-license-numbering.mjs scripts/test-paid-license-database-integrity.mjs | tee /tmp/onboarding-repair-tests.txt
          node scripts/test-ocr-sidecar.mjs
          deno check --config supabase/functions/income-calculator/deno.json supabase/functions/income-calculator/index.ts
          bun run build
          node_modules/.bin/tsc --noEmit --pretty false
      - name: Authenticated browser acceptance with isolated synthetic identities
        env:
          ALLOW_SYNTHETIC_INCOME_ACCEPTANCE: '1'
          ACCEPTANCE_UI_BASE_URL: http://127.0.0.1:4173
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          node_modules/.bin/vite dev --host 127.0.0.1 --port 4173 > /tmp/onboarding-repair-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/auth > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-income-onboarding-session.mjs
      - name: Retain non-sensitive verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-calculator-repair-acceptance
          path: |
            /tmp/onboarding-repair-tests.txt
            income-onboarding-authenticated-acceptance.json
          if-no-files-found: warn
          retention-days: 14
