name: Prepare pinned repair dependencies
on:
  push:
    branches: [fix/onboarding-calculator-acceptance]
    paths: ['.github/workflows/onboarding-pinned-sdk.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - name: Align SDK types without changing the configured Stripe API version
        run: |
          bun add --exact stripe@22.4.0
          bun add --dev --exact playwright-core@1.55.1
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));if(p.dependencies.stripe!=='22.4.0'||p.devDependencies['playwright-core']!=='1.55.1')throw Error('Pin mismatch');"
          git config user.name 'CertivoIQ Release Bot'
          git config user.email 'release-bot@certivoiq.com'
          git add package.json bun.lock
          git commit -m 'Pin Stripe 22.4.0 for existing July API and browser acceptance test driver'
          git push origin HEAD:fix/onboarding-calculator-acceptance
      - name: Export exact changed manifests and test dependencies
        run: tar -czf /tmp/onboarding-pinned-deps.tar.gz package.json bun.lock node_modules/stripe node_modules/playwright-core
      - uses: actions/upload-artifact@v4
        with:
          name: onboarding-pinned-deps
          path: /tmp/onboarding-pinned-deps.tar.gz
          retention-days: 2
