name: Cancel hung founder dashboard release once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cancel-hung-founder-dashboard-release-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel hung release run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --write-out '\n%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/33817871851/cancel")"
          code="$(printf '%s' "$response" | tail -n1)"
          test "$code" = "202" || { echo "Cancellation returned HTTP $code"; exit 1; }
          echo "PASS: requested cancellation of hung release run 33817871851."
