name: Production Customer File Recovery Drill

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_PRODUCTION_RECOVERY_DRILL to authorize a production synthetic copy
        required: true
        type: string

permissions:
  contents: read

jobs:
  recovery-drill:
    if: inputs.confirmation == 'RUN_PRODUCTION_RECOVERY_DRILL'
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run copy-and-checksum recovery drill
        run: node scripts/run-production-customer-file-recovery-drill.mjs
      - name: Publish owner-review artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-file-recovery-drill-${{ github.run_id }}
          path: recovery-drill-output/
          if-no-files-found: error
          retention-days: 14
