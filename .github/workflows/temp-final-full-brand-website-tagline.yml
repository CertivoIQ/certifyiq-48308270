name: Temporary final full brand website tagline

on:
  push:
    branches:
      - temp/voice-audio-bridge-20260901
    paths:
      - .github/workflows/temp-final-full-brand-website-tagline.yml

permissions:
  contents: read

jobs:
  fetch-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Download corrected final voiceover
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-audio
          curl --fail --location --retry 3 --output final-audio/final-full-brand-website-tagline.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/5c1ab971-1fb2-410b-ae52-3fcf64d37b2e.mp3'
          test -s final-audio/final-full-brand-website-tagline.mp3
          file final-audio/final-full-brand-website-tagline.mp3
      - name: Upload corrected final voiceover
        uses: actions/upload-artifact@v4
        with:
          name: final-full-brand-website-tagline
          path: final-audio/final-full-brand-website-tagline.mp3
          if-no-files-found: error
          retention-days: 1
