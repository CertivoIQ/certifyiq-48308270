name: Fix TIC lint once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix TIC lint errors'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply exact lint fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          form = Path('src/components/certivoiq-tic-review-form.tsx')
          text = form.read_text()
          bad = '/* eslint-disable react/prop-types, react/jsx-props-no-spreading */\n'
          if text.startswith(bad):
              text = text[len(bad):]
          form.write_text(text)

          parser = Path('src/lib/tic-field-extraction.ts')
          text = parser.read_text()
          text = text.replace('[\\/-]', '[-/]')
          parser.write_text(text)
          PY

          git diff --check
          git diff -- src/components/certivoiq-tic-review-form.tsx src/lib/tic-field-extraction.ts

          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi

          git config user.name 'CertivoIQ Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/certivoiq-tic-review-form.tsx src/lib/tic-field-extraction.ts
          git commit -m 'Fix TIC lint errors'
          git push origin HEAD:main
