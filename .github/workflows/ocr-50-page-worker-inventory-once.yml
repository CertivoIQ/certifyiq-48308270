name: OCR 50 page Worker inventory once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ocr-50-page-worker-inventory-once.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: List relevant Worker IDs only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" \
            -o /tmp/workers.json
          node <<'NODE'
          const d = require('/tmp/workers.json');
          if (!d.success) throw new Error('Cloudflare Worker inventory failed');
          const relevant = d.result.map((w) => w.id).filter((id) => /certivoiq|certifyiq|50|intake/i.test(id)).sort();
          console.log('Relevant Worker IDs:');
          for (const id of relevant) console.log(`- ${id}`);
          if (!relevant.length) console.log('(none)');
          NODE

      - name: Confirm production routes read only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=certivoiq.com&account.id=$CLOUDFLARE_ACCOUNT_ID" -o /tmp/zones.json
          zone_id="$(node -e 'const d=require("/tmp/zones.json"); if(!d.success||d.result.length!==1) process.exit(1); process.stdout.write(d.result[0].id)')"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/workers/routes" -o /tmp/routes.json
          node <<'NODE'
          const d = require('/tmp/routes.json');
          if (!d.success) throw new Error('Route inventory failed');
          for (const pattern of ['certivoiq.com/*','www.certivoiq.com/*']) {
            const matches = d.result.filter((r) => r.pattern === pattern);
            if (matches.length !== 1) throw new Error(`Expected one route for ${pattern}`);
            console.log(`${pattern} -> ${matches[0].script}`);
          }
          NODE
          echo "PASS: read-only inventory complete; no route or Worker changed."
