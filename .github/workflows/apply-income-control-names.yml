name: Apply exact calculator control labels
on:
  push:
    branches: [fix/calculator-control-names-0514]
    paths: ['.github/workflows/apply-income-control-names.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/calculator-control-names-0514
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.3 }
      - name: Apply only the reviewed label edits to the exact source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('src/components/income-calculator.tsx'); s=p.read_text()
          assert hashlib.sha256(s.encode()).hexdigest()=='007c7896c4eb0bf5a2a35e8d565fd1216efcd85e7a87297e2b31555ce9ef7ef8'
          pairs=[('<input className={inputClass} type={type}', '<input aria-label={title} className={inputClass} type={type}'),('<select value={value} onChange={(e) => onChange(e.target.value)} className={inputClass}>', '<select aria-label={title} value={value} onChange={(e) => onChange(e.target.value)} className={inputClass}>')]
          for before,after in pairs:
            assert s.count(before)==1
            s=s.replace(before,after)
          assert hashlib.sha256(s.encode()).hexdigest()=='029c69d5f01dee6c4874af29766eaedcf56811709b326ae9b09efd5f485528ae'
          p.write_text(s)
          p=Path('scripts/test-onboarding-handoff.mjs');s=p.read_text();assert 'test-income-control-labels' not in s;p.write_text("import './test-income-control-labels.mjs';\n"+s)
          PY
      - run: bun install --frozen-lockfile
      - name: Verify strict types and labels without changing browser assertions
        run: |
          set -euo pipefail
          node node_modules/typescript/bin/tsc --noEmit --pretty false
          node --test scripts/test-native-income-calculator.mjs scripts/test-onboarding-handoff.mjs
          git diff --check
      - name: Commit source changes and remove this temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/income-calculator.tsx scripts/test-onboarding-handoff.mjs
          git rm .github/workflows/apply-income-control-names.yml
          git commit -m 'Give calculator inputs and selects explicit matching accessible names; preserve all interaction and review behavior'
          git push origin HEAD:fix/calculator-control-names-0514
