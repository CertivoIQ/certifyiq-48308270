name: Patch command center certification actions

on:
  push:
    paths:
      - '.github/workflows/patch-command-center-certification-actions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add direct pending certification actions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/certification-review-panel.tsx')
          text = path.read_text()

          old = '''type CertificationReviewPanelProps = {\n  initialItemId?: string | null;\n};\n\nexport function CertificationReviewPanel({ initialItemId = null }: CertificationReviewPanelProps) {'''
          new = '''type CertificationReviewPanelProps = {\n  initialItemId?: string | null;\n  initialAction?: "support" | "review";\n};\n\nexport function CertificationReviewPanel({ initialItemId = null, initialAction }: CertificationReviewPanelProps) {'''
          if old not in text:
              raise SystemExit('props anchor missing')
          text = text.replace(old, new, 1)

          old = '''  useEffect(() => {\n    if (!initialItemId) return;\n    setSelectedId(initialItemId);\n    setNotice('Saved certification opened from intake.');\n  }, [initialItemId]);'''
          new = '''  useEffect(() => {\n    if (!initialItemId) return;\n    setSelectedId(initialItemId);\n    setNotice(\n      initialAction === 'support'\n        ? 'Pending certification opened from the Command Center. Attach one supporting document below.'\n        : initialAction === 'review'\n          ? 'Pending certification opened from the Command Center. Review this certification when ready.'\n          : 'Saved certification opened.'\n    );\n    window.setTimeout(() => {\n      document.getElementById(`certification-${initialItemId}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });\n    }, 0);\n  }, [initialItemId, initialAction]);'''
          if old not in text:
              raise SystemExit('effect anchor missing')
          text = text.replace(old, new, 1)

          old = '''  const runQueue = useMutation({\n    mutationFn: async () => {\n      const queued = await queueReviews({ data: { itemIds: [...selectedIds] } });'''
          new = '''  const runQueue = useMutation({\n    mutationFn: async (requestedIds?: string[]) => {\n      const itemIds = requestedIds?.length ? requestedIds : [...selectedIds];\n      const queued = await queueReviews({ data: { itemIds } });'''
          if old not in text:
              raise SystemExit('mutation anchor missing')
          text = text.replace(old, new, 1)

          old = '''            onClick={() => runQueue.mutate()}'''
          new = '''            onClick={() => runQueue.mutate([...selectedIds])}'''
          if old not in text:
              raise SystemExit('queue button anchor missing')
          text = text.replace(old, new, 1)

          old = '''              <div key={item.id} className={`rounded-lg border p-3 ${item.id === activeId ? 'border-primary bg-primary/5' : ''}`}>'''
          new = '''              <div id={`certification-${item.id}`} key={item.id} className={`rounded-lg border p-3 ${item.id === activeId ? 'border-primary bg-primary/5' : ''}`}>'''
          if old not in text:
              raise SystemExit('card anchor missing')
          text = text.replace(old, new, 1)

          old = '''                {item.id === activeId ? <CertificationSupportingDocumentsPanel itemId={item.id} /> : null}'''
          new = '''                {item.id === activeId && (item.review_queue_status === 'not_queued' || item.review_queue_status === 'queued') ? (\n                  <div className="mt-3 flex flex-wrap items-center justify-between gap-3 rounded-lg border border-primary/20 bg-primary/5 p-3">\n                    <div>\n                      <p className="text-sm font-medium">Pending certification actions</p>\n                      <p className="mt-1 text-xs text-muted-foreground">Attach supporting evidence before review, or begin the controlled review for this certification only.</p>\n                    </div>\n                    <button\n                      type="button"\n                      disabled={runQueue.isPending}\n                      onClick={() => runQueue.mutate([item.id])}\n                      className="inline-flex items-center gap-2 rounded-md bg-primary px-3 py-2 text-sm font-medium text-primary-foreground disabled:opacity-50"\n                    >\n                      <PlayCircle className="size-4" />\n                      {runQueue.isPending ? 'Reviewing…' : 'Review Certification'}\n                    </button>\n                  </div>\n                ) : null}\n                {item.id === activeId ? <CertificationSupportingDocumentsPanel itemId={item.id} /> : null}'''
          if old not in text:
              raise SystemExit('support panel anchor missing')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit certification detail actions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CertivoIQ Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/certification-review-panel.tsx
          git diff --cached --check
          git commit -m 'Add direct pending certification review action'
          git push origin HEAD:main
