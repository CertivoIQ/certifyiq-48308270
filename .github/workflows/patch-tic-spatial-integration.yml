# Validated helper for flattened TIC spatial OCR integration.
name: Patch TIC spatial OCR integration

on:
  push:
    paths:
      - '.github/workflows/patch-tic-spatial-integration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply spatial integration patch
        run: python scripts/apply-tic-spatial-integration.py
      - name: Verify spatial regressions
        run: |
          node --test scripts/test-tic-spatial-extraction.mjs
          node --test scripts/test-tic-native-form-extraction.mjs
          git diff --check
      - name: Commit spatial integration
        run: |
          git config user.name "CertivoIQ Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/pdf-ocr.ts
          git commit -m "Map flattened TIC OCR into spatial review cells"
          git push origin HEAD:main
