# Retrigger TIC row mapping patch.
name: Patch TIC row field mapping

on:
  push:
    paths:
      - '.github/workflows/patch-tic-row-field-mapping.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add generated TIC row aliases
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/lib/tic-field-registry.ts')
          s = p.read_text()
          replacements = {
            'field(`household_member_${member}_last_name`, `${prefix} — last name`, "Part II — Household Composition", "text")': 'field(`household_member_${member}_last_name`, `${prefix} — last name`, "Part II — Household Composition", "text", [`household member ${member} last name`])',
            'field(`household_member_${member}_first_name_middle_initial`, `${prefix} — first name & middle initial`, "Part II — Household Composition", "text")': 'field(`household_member_${member}_first_name_middle_initial`, `${prefix} — first name & middle initial`, "Part II — Household Composition", "text", [`household member ${member} first name middle initial`])',
            'field(`household_member_${member}_relationship`, `${prefix} — relationship to head`, "Part II — Household Composition", "text")': 'field(`household_member_${member}_relationship`, `${prefix} — relationship to head`, "Part II — Household Composition", "text", [`household member ${member} relationship`])',
            'field(`household_member_${member}_race`, `${prefix} — race`, "Part II — Household Composition", "text")': 'field(`household_member_${member}_race`, `${prefix} — race`, "Part II — Household Composition", "text", [`household member ${member} race`])',
            'field(`household_member_${member}_ethnicity`, `${prefix} — ethnicity`, "Part II — Household Composition", "text")': 'field(`household_member_${member}_ethnicity`, `${prefix} — ethnicity`, "Part II — Household Composition", "text", [`household member ${member} ethnicity`])',
            'field(`household_member_${member}_disability`, `${prefix} — disability status`, "Part II — Household Composition", "text")': 'field(`household_member_${member}_disability`, `${prefix} — disability status`, "Part II — Household Composition", "text", [`household member ${member} disability`])',
            'field(`household_member_${member}_gender`, `${prefix} — gender`, "Part II — Household Composition", "text")': 'field(`household_member_${member}_gender`, `${prefix} — gender`, "Part II — Household Composition", "text", [`household member ${member} gender`])',
            'field(`household_member_${member}_date_of_birth`, `${prefix} — date of birth`, "Part II — Household Composition", "date")': 'field(`household_member_${member}_date_of_birth`, `${prefix} — date of birth`, "Part II — Household Composition", "date", [`household member ${member} date of birth`])',
            'field(`household_member_${member}_full_time_student`, `${prefix} — full-time student`, "Part II — Household Composition", "yes_no")': 'field(`household_member_${member}_full_time_student`, `${prefix} — full-time student`, "Part II — Household Composition", "yes_no", [`household member ${member} full-time student`])',
            'field(`household_member_${member}_ssn_or_alien_registration`, `${prefix} — SSN / alien registration number`, "Part II — Household Composition", "text")': 'field(`household_member_${member}_ssn_or_alien_registration`, `${prefix} — SSN / alien registration number`, "Part II — Household Composition", "text", [`household member ${member} ssn alien registration`])',
            'field(`income_member_${member}_wages_business`, `${prefix} — employment or wages`, "Part III — Gross Annual Income", "currency")': 'field(`income_member_${member}_wages_business`, `${prefix} — employment or wages`, "Part III — Gross Annual Income", "currency", [`income member ${member} employment or wages`])',
            'field(`income_member_${member}_social_security_pension`, `${prefix} — Social Security / pensions`, "Part III — Gross Annual Income", "currency")': 'field(`income_member_${member}_social_security_pension`, `${prefix} — Social Security / pensions`, "Part III — Gross Annual Income", "currency", [`income member ${member} social security pensions`])',
            'field(`income_member_${member}_public_assistance`, `${prefix} — public assistance`, "Part III — Gross Annual Income", "currency")': 'field(`income_member_${member}_public_assistance`, `${prefix} — public assistance`, "Part III — Gross Annual Income", "currency", [`income member ${member} public assistance`])',
            'field(`income_member_${member}_other_income`, `${prefix} — other income`, "Part III — Gross Annual Income", "currency")': 'field(`income_member_${member}_other_income`, `${prefix} — other income`, "Part III — Gross Annual Income", "currency", [`income member ${member} other income`])',
            'field(`asset_${row}_household_member_number`, `Asset ${row} — household member #`, "Part IV — Income From Assets", "number")': 'field(`asset_${row}_household_member_number`, `Asset ${row} — household member #`, "Part IV — Income From Assets", "number", [`asset ${row} household member number`])',
            'field(`asset_${row}_type`, `Asset ${row} — type of asset`, "Part IV — Income From Assets", "text")': 'field(`asset_${row}_type`, `Asset ${row} — type of asset`, "Part IV — Income From Assets", "text", [`asset ${row} type`])',
            'field(`asset_${row}_current_disposed`, `Asset ${row} — current / disposed`, "Part IV — Income From Assets", "text")': 'field(`asset_${row}_current_disposed`, `Asset ${row} — current / disposed`, "Part IV — Income From Assets", "text", [`asset ${row} current disposed`])',
            'field(`asset_${row}_category`, `Asset ${row} — NNPP / Real / Tax Relief`, "Part IV — Income From Assets", "text")': 'field(`asset_${row}_category`, `Asset ${row} — NNPP / Real / Tax Relief`, "Part IV — Income From Assets", "text", [`asset ${row} category`])',
            'field(`asset_${row}_cash_value`, `Asset ${row} — cash value`, "Part IV — Income From Assets", "currency")': 'field(`asset_${row}_cash_value`, `Asset ${row} — cash value`, "Part IV — Income From Assets", "currency", [`asset ${row} cash value`])',
            'field(`asset_${row}_income_method`, `Asset ${row} — actual / imputed`, "Part IV — Income From Assets", "text")': 'field(`asset_${row}_income_method`, `Asset ${row} — actual / imputed`, "Part IV — Income From Assets", "text", [`asset ${row} income method`])',
            'field(`asset_${row}_annual_income`, `Asset ${row} — annual income from asset`, "Part IV — Income From Assets", "currency")': 'field(`asset_${row}_annual_income`, `Asset ${row} — annual income from asset`, "Part IV — Income From Assets", "currency", [`asset ${row} annual income`])',
            'field(`household_member_${member}_signature_present`, `Household member ${member} — signature present`, "Household Certification & Signatures", "yes_no")': 'field(`household_member_${member}_signature_present`, `Household member ${member} — signature present`, "Household Certification & Signatures", "yes_no", [`household member ${member} signature present`])',
            'field(`household_member_${member}_signature_date`, `Household member ${member} — signature date`, "Household Certification & Signatures", "date")': 'field(`household_member_${member}_signature_date`, `Household member ${member} — signature date`, "Household Certification & Signatures", "date", [`household member ${member} signature date`])',
          }
          changed = 0
          for old, new in replacements.items():
            if old in s:
              s = s.replace(old, new)
              changed += 1
          if changed < 20:
            raise SystemExit(f'Expected at least 20 row alias replacements, applied {changed}')
          p.write_text(s)

          t = Path('scripts/test-tic-native-form-extraction.mjs')
          txt = t.read_text()
          extra = """

test('native row aliases route values into generated TIC cells', () => {
  for (const expected of [
    'household member ${member} last name',
    'household member ${member} first name middle initial',
    'income member ${member} employment or wages',
    'income member ${member} social security pensions',
    'asset ${row} type',
    'asset ${row} cash value',
  ]) assert.match(registry, new RegExp(expected.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')));
});
"""
          if 'native row aliases route values into generated TIC cells' not in txt:
            t.write_text(txt + extra)
      - name: Verify focused mapping regression
        run: |
          node --test scripts/test-tic-native-form-extraction.mjs
          git diff --check
      - name: Commit mapping fix
        run: |
          git config user.name "CertivoIQ Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/tic-field-registry.ts scripts/test-tic-native-form-extraction.mjs
          git commit -m "Map native TIC row values into review cells"
          git push origin HEAD:main
