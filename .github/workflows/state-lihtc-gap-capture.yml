name: State LIHTC Gap Capture
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/capture-state-lihtc-gap-documents.mjs
      - .github/workflows/state-lihtc-gap-capture.yml
      - src/lib/nationwide-state-source-discovery.json
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture missing exact LIHTC QAP/manual/limit documents
        run: node scripts/capture-state-lihtc-gap-documents.mjs
      - name: Upload exact state LIHTC gap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-lihtc-gap-documents
          path: artifacts/state-lihtc-gap-documents.json
          if-no-files-found: error
          retention-days: 30
